<style>
:root{--bg:#f3f5fa;--surface:#fff;--surface2:#ecf0f7;--ink:#0b1b3a;--muted:#5a6a85;--line:#dbe2ee;--accent:#1f4e8c;--accent-ink:#fff;--accent-soft:#dce7f6;--danger:#c42b2b;--shadow:0 1px 2px rgba(11,27,58,.05),0 6px 24px rgba(11,27,58,.07);--r:14px;--side:244px}
[data-theme=dark]{--bg:#080d18;--surface:#101828;--surface2:#19233a;--ink:#e8eefa;--muted:#92a3c2;--line:#24304a;--accent:#6ea8ff;--accent-ink:#04122b;--accent-soft:#14264a;--danger:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;font-family:Satoshi,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand i svg{width:18px;height:18px;stroke:var(--accent-ink)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:transparent;color:var(--muted);border:0;padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sidefoot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface2);font-size:13px;color:var(--muted)}
.sidefoot b{color:var(--ink);display:block;font-size:13px;margin-bottom:2px}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .sp{flex:1}
.mbrand{display:none;font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip.warn::before{background:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1240px;margin:0 auto;padding:26px 28px 60px}
h2{font-family:'Cabinet Grotesk',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 18px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{margin:0 0 10px;font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:-10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.alt:hover{background:var(--surface2)}
.btn.del{background:transparent;color:var(--danger);padding:5px 9px;margin:0;font-weight:500}
.btn.sm{padding:6px 11px;margin:3px 3px 0 0;font-size:13px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase}tr:last-child td{border-bottom:0}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.g{background:var(--accent-soft);color:var(--accent)}.tag.o{background:var(--surface2);color:var(--muted)}
.part{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0}.part.c{border-color:#e0a21b}.part.v{border-color:#4f8fc0}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:32px 16px;border:1.5px dashed var(--line);border-radius:var(--r);background:transparent}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.kpi-card .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi-card .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi{font-family:'Cabinet Grotesk',sans-serif;font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px}
.kpi-card small{color:var(--muted);font-size:13px}
.hero{border-radius:20px;padding:26px 28px;margin-bottom:22px;background:linear-gradient(135deg,#0b1f44,#1f4e8c 60%,#2f6bb5);color:#fff;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.hero::after{pointer-events:none;content:"";position:absolute;right:-60px;top:-40px;width:280px;height:280px;border-radius:50%;border:30px solid rgba(255,255,255,.07)}
.hero h2{color:#fff;margin:0 0 4px;font-size:30px}.hero p{margin:0;opacity:.85}
.hero .btn{background:#fff;color:#0b1f44;margin:0}.hero .btn.alt{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.scroll{overflow-x:auto}
.task{display:grid;grid-template-columns:1fr 80px 36px;gap:8px;margin-top:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.sec h3{margin:0;font-size:17px}
.sec a{color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.ed{grid-template-columns:1fr}}
.pitch{background:#0b1f12;border-radius:16px;overflow:hidden;line-height:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.pitch svg{width:100%;height:auto;touch-action:none;user-select:none}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;align-items:center}
.pal button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s}
.pal button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pal .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:0 4px 0 10px}.pal .lab:first-child{margin-left:0}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.ctl select,.ctl input{width:auto;padding:5px 8px;border-radius:8px}
.fh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 2px 6px}
.fb{background:transparent}
.fb textarea,.fb input{background:var(--surface)}
.fb.big textarea{min-height:130px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.f4 .fh{padding-top:0}
@media(max-width:640px){.f4{grid-template-columns:1fr 1fr}}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tit{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 14px;box-shadow:var(--shadow)}
.tit span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}.tit input{border:0;background:transparent;font-family:'Cabinet Grotesk',sans-serif;font-size:20px;font-weight:700;box-shadow:none!important}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.hcard:hover{transform:translateY(-3px)}
.hcard .th{line-height:0;background:#0b1f12}.hcard .th svg{width:100%;height:auto}
.hcard .b{padding:14px 16px 12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .22s;z-index:50;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
[data-theme=light] .toast button{color:#6ea8ff}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;height:96px}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pal2{margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}.pal2 summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px}
.icog{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;padding:4px 0 12px}
.icog button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#2c3a33;border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;cursor:pointer;color:#e9f1ed;font:inherit;font-size:11px;line-height:1.15;text-align:center}
.icog button:hover{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.icog img{height:40px;width:auto;max-width:72px;object-fit:contain}
.asis-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.asis-h .sp{flex:1}
.asis-l{display:grid;gap:4px;max-height:300px;overflow:auto}
.asis-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.asis-b{display:flex;gap:4px}.asis-b button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-width:44px}
.asis-b .as-p.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.asis-b .as-a.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.asis-b .as-j.on{background:#e0a21b;color:#2a1d00;border-color:#e0a21b}
.asis-b .as-l.on{background:#6b7fd7;color:#fff;border-color:#6b7fd7}
.asb{font-style:normal;font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 6px;margin-left:4px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;display:inline-block}.d-p{background:var(--accent)}.d-a{background:var(--danger)}.d-j{background:#e0a21b}.d-l{background:#6b7fd7}
.tt{display:flex;gap:12px;align-items:center;margin:8px 0}.ttv{flex:none;width:240px;cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.ttv svg{display:block;width:100%;height:auto}@media(max-width:600px){.tt{flex-direction:column;align-items:stretch}.ttv{width:100%}}
.adv{display:grid;gap:8px}.adv-i{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.adv-i p{margin:2px 0 4px;font-size:14px}.adv-i small{color:var(--muted);font-size:12px}
.adv-ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.adv-i.warn{border-color:#e0a21b}.adv-i.warn .adv-ic{background:#e0a21b;color:#2a1d00}.adv-i.ok .adv-ic{background:var(--accent);color:var(--accent-ink)}
.adv{padding:8px 12px;border-radius:10px;margin:6px 0;background:var(--surface2);border-left:3px solid var(--accent)}.adv.warn{border-color:var(--danger)}.adv.tip{border-color:#e0a21b}.guia .card ul{margin:6px 0;padding-left:20px}.guia .card li{margin:3px 0}
@media(max-width:860px){
 .asis-r{flex-direction:column;align-items:stretch}
 .kpis{grid-template-columns:1fr 1fr}.kpi-card{padding:12px;gap:10px}.kpi-card .ic{width:36px;height:36px}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);flex-direction:row;gap:0}
 .brand,.sidefoot{display:none}
 nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px;scrollbar-width:none}
 nav button{flex-direction:column;gap:3px;padding:7px 11px;font-size:11px;white-space:nowrap;flex:none;align-items:center}
 .topbar{padding:10px 16px}.mbrand{display:block}
 main{padding:18px 16px 110px}
 h2{font-size:24px}.hero{padding:20px}.hero h2{font-size:24px}
}
@media print{.side,.topbar,.noprint,.pal,.ctl,.toast{display:none!important}.shell{display:block}body{background:#fff}}

.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.calbar .sp{flex:1}.navs{display:flex;gap:6px;align-items:center}.ctit{font-family:'Cabinet Grotesk',sans-serif;font-size:20px;text-transform:capitalize}
.leg{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:8px}.leg i.s,.ev.s{--c:var(--accent)}.leg i.p,.ev.p{--c:#e0a21b}.leg i{background:var(--c)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px;text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:110px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:4px}
.cgrid.semana .cd{min-height:280px}.cd:hover{border-color:var(--accent)}.cd.over{background:var(--accent-soft);border-color:var(--accent)}
.cd.fuera{opacity:.45}.cd.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cd.hoy .dn b{background:var(--accent);color:var(--accent-ink)}
.dh{display:flex;justify-content:space-between;align-items:center}.dn{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600}.dn b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px;font-size:13px;color:var(--ink);padding:0 4px}
.add{opacity:0;border:0;background:var(--surface2);color:var(--ink);width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1}.cd:hover .add{opacity:1}
.ev{font-size:12px;line-height:1.3;padding:4px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:3px solid var(--c);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgrid.semana .ev{white-space:normal;font-size:13px;padding:6px 8px}.more{font-size:12px;color:var(--muted)}
.tag.am{background:color-mix(in srgb,#e0a21b 22%,var(--surface));color:#9a6b00}[data-theme=dark] .tag.am{color:#f0c14b}.tag.rd{background:color-mix(in srgb,var(--danger) 18%,var(--surface));color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(5,12,9,.55);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:16px;animation:fi .15s}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:18px}
.evrow{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.evrow:hover{border-color:var(--accent)}
@keyframes fi{from{opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
.delta{font-weight:700;color:var(--muted)}.delta.up{color:var(--accent)}.delta.dn{color:var(--danger)}

<script>

const _raw=window.__API_BASE__,_un=_raw.startsWith('__PORT_');

let _t,MODO='api';
const lsGet=()=>{try{const v=localStorage.getItem(K);return v?JSON.parse(v):null}catch{return null}};

const save=()=>{estado('Guardando…');clearTimeout(_t);_t=setTimeout(async()=>{const ok=lsSet();fsEscribir();gdEscribir();if(MODO!=='api'){estado(ok?'Guardado en este dispositivo':'Sin conexión: no guardado');return}try{const r=await fetch(API+'/api/datos',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});if(!r.ok)throw 0;estado('Guardado')}catch{estado(ok?'Guardado en este dispositivo':'Sin conexión: no guardado')}},400)};

async function cargar(){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),2500);const r=await fetch(API+'/api/datos',{signal:c.signal});clearTimeout(to);if(!r.ok)throw 0;const d=await r.json();Object.assign(S,d);MODO='api';estado('Todo al día')}catch{MODO='local';const d=lsGet();if(d)Object.assign(S,d);estado('Guardado en este dispositivo')}}
const id=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const TABS={inicio:'Inicio',calendario:'Calendario',sesiones:'Sesiones',partidos:'Partidos',jugadores:'Jugadores',fisica:'Preparación física',pruebas:'Pruebas físicas',evolucion:'Evolución',editor:'Editor de tareas',historico:'Histórico',datos:'Datos'};
let tab='inicio';
const IC={inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',jugadores:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.2.6 3.5 2.4 3.5 6"/>',sesiones:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/>',fisica:'<path d="M3 12h2M19 12h2M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/>',pruebas:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',editor:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/>',historico:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9M10 13h4"/>',datos:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',calendario:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4M8 14h2M14 14h2M8 17h2"/>',partidos:'<path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8"/>',evolucion:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
function nav(){$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" ${k==tab?'aria-current="page"':''} onclick="go('${k}')">${ico(k)}<span>${v}</span></button>`).join('')}
let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
function applyTheme(){document.documentElement.dataset.theme=theme;const b=$('#theme');if(b)b.innerHTML=ico(theme==='dark'?'sun':'moon')}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();if(tab==='evolucion')R.evolucion()}
let _tt;function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?' <button id="tu">Deshacer</button>':'');t.classList.add('on');if(undo)$('#tu').onclick=()=>{undo();t.classList.remove('on')};clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),undo?5000:2200)}
const emptyS=(t,d)=>`<div class="empty"><b>${t}</b>${d}</div>`;
function go(t){if(typeof killCharts==='function')killCharts();tab=t;nav();R[t]();scrollTo(0,0)}
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}):''
const jName=i=>(S.jugadores.find(j=>j.id==i)||{}).nombre||'—';
const jOpts=(sel)=>S.jugadores.map(j=>`<option value="${j.id}" ${j.id==sel?'selected':''}>${esc(j.nombre)}</option>`).join('');
const fd=v=>Object.fromEntries(new FormData(v));

const R={
inicio(){const hoyS=new Date().toISOString().slice(0,10);const prox=[...S.sesiones].sort((a,b)=>a.fecha<b.fecha?-1:1).filter(s=>s.fecha>=hoyS).slice(0,3);
const rec=[...(S.tareas||[])].sort((a,b)=>(b.editada||'')>(a.editada||'')?1:-1).slice(0,3);
const K=(ic,n,t,g)=>`<div class="kpi-card" ${g?`onclick="go('${g}')" style="cursor:pointer" role="button" tabindex="0"`:''}><div class="ic">${ico(ic)}</div><div><div class="kpi">${n}</div><small>${t}</small></div></div>`;
const nom=nombreVista(),hh=new Date().getHours(),sal=hh<13?'Buenos días':hh<20?'Buenas tardes':'Buenas noches';const pp=[...(S.partidos||[])].filter(p=>p.fecha>=hoyS).sort((a,b)=>a.fecha<b.fecha?-1:1);const sem=S.sesiones.filter(x=>x.fecha>=hoyS&&x.fecha<=addD(hoyS,6)).length;
const CH=(t,g)=>`<span onclick="${/^\w+\(/.test(g)?g:`go('${g}')`}" style="cursor:pointer;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:99px;font-size:13px;white-space:nowrap">${t}</span>`;
const chips=[prox[0]?CH('Pasar lista · '+esc(fmt(prox[0].fecha)),"abrirEv('s','"+prox[0].id+"')"):'',prox[0]?CH('Próxima sesión: '+esc(fmt(prox[0].fecha))+(prox[0].hora?' · '+esc(prox[0].hora):''),'calendario'):'',pp[0]?CH('Próximo partido: '+esc(pp[0].rival||'Rival')+' · '+esc(fmt(pp[0].fecha)),'partidos'):'',CH('Esta semana: '+sem+' sesión'+(sem==1?'':'es'),'calendario'),CH('Carga semanal','carga')].join('');
$('#app').innerHTML=`<div class="hero"><div><h2>${sal}, ${esc(nom||'entrenador')}</h2><p>${S.sesiones.length||pp.length?'Tienes '+prox.length+' sesión'+(prox.length==1?'':'es')+' próxima'+(prox.length==1?'':'s')+' y '+pp.length+' partido'+(pp.length==1?'':'s')+' por jugar. <a onclick="cambiarNombre()" style="cursor:pointer;text-decoration:underline;opacity:.85">'+(nom?'Cambiar nombre':'Poner mi nombre')+'</a>':'Empieza preparando tu primera sesión. <a onclick="cambiarNombre()" style="cursor:pointer;text-decoration:underline;opacity:.85">Poner mi nombre</a>'}</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${chips}</div></div><div class="acts"><button class="btn" onclick="ed=nuevaTarea();go('editor')">${ico('plus')}Nueva tarea</button><button class="btn alt" onclick="go('sesiones')">Planificar sesión</button><button class="btn alt" onclick="formPartido(todayS())">Nuevo partido</button><button class="btn alt" onclick="go('jugadores')">Añadir jugador</button></div></div>
<div class="kpis">${K('jugadores',S.jugadores.length,'jugadores','jugadores')}${K('sesiones',S.sesiones.length,'sesiones','sesiones')}${K('fisica',S.planes.length,'planes físicos','fisica')}${K('pruebas',S.pruebas.length,'pruebas','pruebas')}${K('partidos',(S.partidos||[]).length,'partidos','partidos')}${K('historico',(S.tareas||[]).length,'tareas guardadas','historico')}</div>
<div class="sec"><h3>Próximas sesiones</h3><a onclick="go('calendario')">Abrir calendario</a></div>${prox.length?prox.map(cardSesion).join(''):emptyS('Sin sesiones próximas','Planifícalas en el calendario o en «Sesiones».')}
<div class="sec"><h3>Tareas recientes</h3><a onclick="go('historico')">Abrir histórico</a></div><div class="hgrid">${rec.map(t=>`<div class="hcard" style="cursor:pointer" onclick="abrirT('${t.id}')"><div class="th">${svgTarea(t.els||[],t.fondo,'i'+t.id,-1)}</div><div class="b"><b>${esc(t.titulo)}</b><div class="muted" style="font-size:13px">Editada ${fmt(t.editada)}</div></div></div>`).join('')||emptyS('Aún no hay tareas','Dibuja tu primera tarea en el editor.')}</div>`},

jugadores(){$('#app').innerHTML=`<h2>Jugadores</h2><div class="grid" style="grid-template-columns:1fr">
<form class="card" id="f" style="order:2"><h3>Añadir jugador</h3><label>Nombre</label><input name="nombre" required>
<div class="row"><div><label>Dorsal</label><input name="dorsal" type="number"></div><div><label>Posición</label><select name="pos"><option>Portero</option><option>Defensa</option><option>Centrocampista</option><option>Delantero</option></select></div></div>
<button class="btn">Guardar</button></form>
<div class="card scroll" style="min-width:0">${S.jugadores.length?`<table><tr><th>#</th><th>Nombre</th><th>Posición</th><th>Partidos</th><th>Minutos</th><th>% min</th><th>Titular</th><th>Convoc.</th><th>No asist. partido</th><th>Goles</th><th>Asist.</th><th>Entrenos</th><th>Faltas entreno</th><th>Just. entreno</th><th>Lesión entreno</th><th>Asist. entreno %</th><th></th></tr>${S.jugadores.map(j=>{const e=statsJ(j);return`<tr><td>${esc(j.dorsal)}</td><td><b>${esc(j.nombre)}</b>${j.cap?' <span class="muted">(C)</span>':''}</td><td><span class="tag">${esc(j.pos)}</span></td><td>${e.pj}</td><td>${e.min}</td><td>${e.pm==null?'–':e.pm+'%'}</td><td>${e.tit}</td><td>${e.cv}</td><td>${e.nm}</td><td>${e.gol}</td><td>${e.ast}</td><td>${e.ses}</td><td>${e.fal}</td><td>${e.jus}</td><td>${e.les}</td><td>${e.pct==null?'–':e.pct+'%'}</td><td>${btnEd('jugadores',j.id)}<button class="btn del" onclick="del('jugadores','${j.id}')">Borrar</button></td></tr>`}).join('')}</table>`:emptyS('Aún no hay jugadores','Añade el primero con el formulario.')}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();S.jugadores.push({id:id(),...fd(e.target)});save();R.jugadores()}},

sesiones(){$('#app').innerHTML=`<h2>Sesiones de entrenamiento</h2><form class="card noprint" id="f"><h3>Nueva sesión</h3>
<div class="row"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Hora</label><input type="time" name="hora" value="18:00"></div><div><label>Categoría</label><input name="cat" placeholder="Benjamín, Cadete…"></div><div><label>Microciclo / semana</label><input name="micro"></div></div>
<label>Objetivo principal</label><input name="obj" placeholder="Ej.: transiciones ataque-defensa en 1-2-3-1">
<label>Material</label><input name="mat" placeholder="Balones, conos, petos…">
${['c:Calentamiento','p:Parte principal','v:Vuelta a la calma'].map(x=>{const[k,n]=x.split(':');return`<div class="part ${k}"><b>${n}</b><div id="t_${k}"></div><button type="button" class="btn alt" onclick="addTask('${k}')">+ Tarea</button> <select style="width:auto;max-width:100%;display:inline-block;margin-top:10px" onchange="fromHist('${k}',this)"><option value="">+ Del histórico…</option>${(S.tareas||[]).map(t=>`<option value="${t.id}">${esc(t.titulo)}</option>`).join('')}</select></div>`}).join('')}
<button class="btn">Guardar sesión</button></form><div id="lista" style="margin-top:14px"></div>`;
['c','p','v'].forEach(addTask);
$('#f').onsubmit=e=>{e.preventDefault();const f=e.target,d=fd(f);const parts={};['c','p','v'].forEach(k=>{parts[k]=[...f.querySelectorAll('#t_'+k+' .task')].map(r=>({t:r.children[0].value,m:+r.children[1].value||0,tid:r.dataset.tid||''})).filter(t=>t.t)});S.sesiones.push({id:id(),...d,parts});Object.values(parts).flat().filter(t=>t.tid).forEach(t=>{const tt=(S.tareas||[]).find(x=>x.id===t.tid);if(tt)logUso(tt,'Usada en sesión',(d.fecha||'')+' · '+(d.cat||''))});save();R.sesiones()};
$('#lista').innerHTML=[...S.sesiones].sort((a,b)=>a.fecha<b.fecha?1:-1).map(cardSesion).join('')||emptyS('Sin sesiones todavía','Rellena el formulario y guarda tu primera sesión.')},

fisica(){$('#app').innerHTML=`<h2>Preparación física por jugador</h2><div class="grid">

<div class="row"><div><label>Series</label><input name="series" type="number"></div><div><label>Reps / tiempo</label><input name="reps"></div><div><label>Recup.</label><input name="rec" placeholder="60 s"></div><div><label>RPE (1-10)</label><input name="rpe" type="number" min="1" max="10"></div></div>

<button class="btn">Guardar plan</button></form>
<div style="grid-column:span 2;min-width:0" class="grid">${S.planes.map(p=>`<div class="card"><span class="tag">${esc(p.cap)}</span> <span class="muted">${esc(p.fase)}</span><h3 style="margin-top:8px">${p.jug=='todos'?'Todo el equipo':esc(jName(p.jug))}</h3><div style="white-space:pre-wrap">${esc(p.ej)}</div><p class="muted">${esc(p.series)}×${esc(p.reps)} · rec. ${esc(p.rec)} · RPE ${esc(p.rpe)} · ${esc(p.dias)} días/sem${p.desde?' · desde '+esc(p.desde):''}</p>${btnEd('planes',p.id)}<button class="btn del" onclick="del('planes','${p.id}')">Borrar</button></div>`).join('')||emptyS('Sin planes físicos','Asigna trabajo a un jugador o a todo el equipo.')}</div></div>`;

 if(/transici|pérdida|perdida|recuper/.test(txt)||/1-2-3-1/.test(txt)){A('tip','Transiciones y 1-2-3-1','Al perder: presión tras pérdida y organización defensiva básica. Al recuperar: pase de descarga a zona libre y desmarques de apoyo y de ruptura. Pide amplitud (bandas) y triángulos entre líneas.',FUENTE.met)}
 if(/(2|3)\s*(v|vs|contra)\s*(1|2)/.test(txt)||/superioridad/.test(txt))A('tip','Superioridad numérica','Con ventaja numérica busca el lado libre; si hay un defensor, encara; si hay dos, pasa. Recuerda que también existen ventajas posicionales y socio-afectivas (animar al compañero que falla).',FUENTE.met);
 if(/1\s*(v|vs|contra)\s*1/.test(txt)||/regat|conduc/.test(txt))A('tip','Conducir y regatear: consignas','Balón pegado al pie. Mira arriba. Ve hacia el defensor y, cuando esté cerca, engáñale y acelera. Si no puedes pasar, protege el balón. Usa las dos piernas.',FUENTE.fb);
 // 6. reglas de provocación
 if(!/toque|gol doble|punto|obligad|limitad|libre|zona/.test(txt)&&(t.normas||'').trim().length<20)A('tip','Añade una regla de provocación','Ejemplos: toque limitado (más ritmo y pérdidas), toque libre (más duelos y decisión individual), toque obligado (apoyos y decisión grupal), gol doble tras regate. La regla no debe ir contra la lógica del juego.',FUENTE.met);
 else if(/(\b[12] toques?|dos toques|un toque)/.test(txt))A('tip','Toque limitado','Aumenta el ritmo de juego y la velocidad, pero también las pérdidas de balón. Si ves muchas pérdidas, pasa a toque libre.',FUENTE.met);
 // 7. variantes y progresión
 if(!(t.variantes||'').trim())A('tip','Prepara una progresión','Principio de progresión: sube la dificultad aumentando el volumen, la intensidad, la complejidad o la tensión psicológica. Ideas: añade un rival, reduce el espacio, limita los toques, suma un objetivo de puntuación.',FUENTE.ent);
 // 8. indicador/correcciones
 if(!(t.indicador||'').trim())A('tip','Define un indicador de éxito','Algo medible por jugador o equipo. Ejemplo de tu ficha: cada jugador supera al defensor en al menos 3 de 6 intentos, o cada equipo marca 2 goles tras regate por partido.',FUENTE.fb);
 // 9. físico y seguridad
 const mat=els.filter(e=>e.t==='img').map(e=>e.k);const pesado=mat.filter(k=>/cajon|barra|kettle|chaleco|trineo|arnes/.test(k));
 if(pesado.length&&E&&['pre','benj','alev'].includes(ed_))A('warn','Material de carga para edades tempranas','Has usado material de fuerza ('+pesado.map(k=>ICO[k][0]).join(', ')+'). En niños está contraindicado desarrollar fuerza máxima y pliometría de alta intensidad (saltos desde altura). Usa autocarga, saltos bajos, balones medicinales de 1 a 3 kg y ejercicios por parejas.',FUENTE.ent);
 if(/fuerza|salto|multisalto|pliom|sprint|velocidad|resistencia|carrera|flexib|movilidad/.test(txt)&&E){const f=[];if(/velocidad|sprint/.test(txt))f.push('Velocidad: distancias de 10 a 15 m, máxima intensidad, 60 a 90 m por sesión, 2 a 3 días por semana, recuperación completa (unos 2 min), con estímulos y salidas variados.');if(/resistencia|carrera/.test(txt))f.push('Resistencia: aeróbica extensiva con juegos y terrenos variados; evita lo anaeróbico láctico y las carreras largas monótonas.');if(/fuerza|salto|multisalto|pliom/.test(txt))f.push('Fuerza: usa el peso corporal, saltos y lanzamientos con balones de 1 a 3 kg y ejercicios por parejas; 1 a 3 series de unas 15 repeticiones, con técnica supervisada.');if(/flexib|movilidad/.test(txt))f.push('Flexibilidad: de 6 a 12 años, a través de juegos y movilidad articular sin llegar al límite; estática al final de la sesión, dinámica tras el calentamiento.');A('tip','Trabajo físico para '+E.n,f.join(' '),FUENTE.ent)}
 else if(E)A('tip','Contenido físico para '+E.n,E.fis,FUENTE.ent);
 // 10. edad
 if(E){A('tip','Cómo son los '+E.n.toLowerCase(),E.rasgos+' '+E.tips.join(' '),ed_==='benj'?FUENTE.fb+' y '+FUENTE.met:FUENTE.met)}
 else A('tip','Indica la categoría','Con Benjamín, Alevín, Infantil o Cadete el asistente adapta los consejos físicos y de comunicación a la edad.',FUENTE.met);
 // 11. correcciones
 A('tip','Comunicación durante la tarea','Explicación breve y concisa, vocabulario constante con el resto de compañeros, refuerza el esfuerzo y la valentía y no sólo los goles. Haz preguntas guiadas al final (descubrimiento guiado).',FUENTE.met);
 return out}
function panelConsejos(L){const ord={warn:0,tip:1,ok:2};const ic={warn:'!',tip:'i',ok:'✓'};return`<div class="adv">${[...L].sort((a,b)=>ord[a.n]-ord[b.n]).map(x=>`<div class="adv-i ${x.n}"><span class="adv-ic">${ic[x.n]}</span><div><b>${esc(x.ti)}</b><p>${esc(x.d)}</p><small>${esc(x.f)}</small></div></div>`).join('')}</div>`}

function consejosSesion(s){const out=[],A=(n,ti,d,f)=>out.push({n,ti,d,f});const P=s.parts||{};const tot=Object.values(P).flat().reduce((a,t)=>a+(+t.m||0),0)||+s.dur||0;const E=EDADES[edadDe({categoria:s.cat})];
 const f=k=>(P[k]||[]).length;
 if(!f('c'))A('warn','Falta calentamiento','Toda sesión lleva calentamiento: eleva la temperatura, previene lesiones y activa el sistema neuromuscular. Progresa de lo global a lo particular y de baja a alta intensidad.',FUENTE.ent);
 if(!f('p'))A('warn','Falta la parte principal','Añade al menos una tarea principal con su objetivo técnico, táctico, físico o psicológico.',FUENTE.ent);
 if(!f('v'))A('tip','Añade vuelta a la calma','Recuperación, estiramientos sencillos y charla en círculo con balance de la sesión. Crea hábito saludable.',FUENTE.ent);
 if(tot&&E&&['pre','benj'].includes(edadDe({categoria:s.cat}))&&tot>70)A('tip','Sesión larga','Para benjamines tu ficha de referencia dura 60 minutos: activación 10, tarea 12, tarea 13, juego aplicado 18 y vuelta a la calma 7.',FUENTE.fb);
 if(!(s.obj||'').trim())A('tip','Define el objetivo principal','Conducta observable y consigna clave: qué debe verse en el campo si sale bien.',FUENTE.fb);
 const c=asCnt(s);if(c.n&&S.jugadores.length&&c.p/S.jugadores.length<.7)A('warn','Asistencia baja','Vinieron '+c.p+' de '+S.jugadores.length+'. Con pocos jugadores reduce el campo o cambia a tareas de menos jugadores.',FUENTE.ent);
 const past=S.sesiones.filter(x=>x.fecha<s.fecha).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];if(past){const dd=(pd(s.fecha)-pd(past.fecha))/864e5;if(dd>=7)A('tip','Continuidad','Han pasado '+dd+' días desde la sesión anterior. Los ejercicios aislados o muy separados no producen adaptación; con 7 días sin entrenar se pierde en torno al 10% de la condición.',FUENTE.ent)}
 A('ok','Principio de variedad','Cambia tareas, espacios y reglas entre sesiones para mantener la motivación y evitar la monotonía.',FUENTE.ent);
 return out}

{const d_=TABS.datos;delete TABS.datos;TABS.guia='Guía del entrenador';TABS.datos=d_}IC.guia='<path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V5.5M9 8h6M9 12h6"/>';

R.guia=function(){const G={
 edad:{n:'Por edad',h:()=>Object.entries({pre:EDADES.pre,benj:EDADES.benj,alev:EDADES.alev,inf:EDADES.inf,cad:EDADES.cad}).map(([k,e])=>`<div class="card"><h3>${e.n}</h3><p>${esc(e.rasgos)}</p><ul>${e.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted"><b>Físico:</b> ${esc(e.fis)}</p></div>`).join('')},
 tarea:{n:'Diseño de tareas',h:()=>`<div class="card"><h3>Variables del espacio</h3><table><tr><th>Si aumentas el espacio</th><th>Si lo disminuyes</th></tr><tr><td>Más fluidez de juego</td><td>Menos fluidez</td></tr><tr><td>Menos densidad de jugadores</td><td>Más densidad</td></tr><tr><td>Más seguridad en el juego</td><td>Menos seguridad</td></tr><tr><td>Más espacio para el poseedor</td><td>Menos espacio</td></tr><tr><td>Menos intensidad física</td><td>Más intensidad</td></tr><tr><td>Menos situaciones 1 contra 1</td><td>Más 1 contra 1</td></tr><tr><td>Más visión de juego</td><td>Menos visión</td></tr></table><p class="muted">Las reglas de provocación no deben atentar contra la lógica del juego.</p></div><div class="card"><h3>Reglas de provocación</h3><ul><li><b>Toque limitado:</b> aumenta el ritmo de juego y la velocidad, pero también las pérdidas.</li><li><b>Toque libre:</b> posesiones más largas, duelos y decisiones individuales.</li><li><b>Toque obligado:</b> provoca apoyos y decisiones grupales.</li></ul></div><div class="card"><h3>Objetivos del rondo</h3><ul><li><b>Ofensivos:</b> ${KB_RONDO.of}.</li><li><b>Defensivos:</b> ${KB_RONDO.de}.</li><li><b>Transiciones:</b> ${KB_RONDO.tr}.</li></ul></div><div class="card"><h3>Medios de entrenamiento</h3><p>Rondos, posesiones, juegos de posición, juegos, técnica colectiva, transiciones y partido modificado. Métodos: analítico, global y estructurado.</p><p class="muted">Figuras técnicas: inespecíficas (circuitos de inicio de pretemporada), semi-específicas (dibujo táctico en una zona) y específicas (una o dos posiciones).</p></div>`},
 fis:{n:'Capacidades físicas',h:()=>`<div class="card"><h3>Qué sí y qué no entre 6 y 12 años</h3><p><b>Se pueden desarrollar:</b> fuerza-resistencia aeróbica y explosiva; resistencia aeróbica y anaeróbica aláctica; reacción, aceleración y velocidad máxima; flexibilidad estática y dinámica.</p><p><b>No deben desarrollarse:</b> fuerza máxima, fuerza-resistencia anaeróbica láctica, resistencia anaeróbica láctica y velocidad-resistencia.</p></div><div class="card"><h3>Velocidad en niños</h3><ul><li>Distancias de 10 a 15 m a máxima intensidad.</li><li>60 a 90 m por sesión, 2 a 3 días por semana.</li><li>Recuperaciones completas (unos 2 minutos).</li><li>Estímulos y salidas diversas, planteamientos lúdicos.</li><li>Mayor mejora del tiempo de reacción entre 6 y 10 años; mayor aumento de la velocidad gestual entre 8 y 12.</li></ul></div><div class="card"><h3>Fuerza en niños</h3><ul><li>Juego como recurso, peso corporal, saltos, lanzamientos y ejercicios por parejas.</li><li>Balones medicinales de 1 a 3 kg.</li><li>1 a 3 series de unas 15 repeticiones, 2 a 3 veces por semana en días alternos.</li><li>Contraindicado: fuerza máxima y pliometría de alta intensidad (saltos desde altura).</li></ul></div><div class="card"><h3>Resistencia y flexibilidad</h3><ul><li>8 a 10 años: aeróbico extensivo, trotes de 3 a 5 min, juegos y terrenos variados.</li><li>11 a 12 años: continuos de 10 a 20 min intercalando fuerza.</li><li>Los niños sudan menos: cuida la hidratación.</li><li>Flexibilidad: fase sensible de 9 a 14 años; dinámica tras el calentamiento y estática al final.</li></ul></div><div class="card"><h3>Coordinación: fases sensibles</h3><ul><li>Coordinación bajo presión de tiempo: 6 a 8 años.</li><li>Reacción óptica y acústica: 8 a 10 años.</li><li>Ritmo: 7 a 9 (chicas) y 8 a 10 (chicos).</li><li>Equilibrio: 9 a 11 años.</li><li>Aprendizaje motor: 9 a 13 años.</li></ul></div>`},
 ses:{n:'La sesión',h:()=>`<div class="card"><h3>Tres partes</h3><p><b>Calentamiento:</b> toma de contacto, parte general (activación y movilidad) y parte específica (aproximación con balón, simulación de juego, finalización). Global, dinámico, progresivo y específico.</p><p><b>Parte principal:</b> contenidos técnicos, tácticos, físicos y psicológicos.</p><p><b>Vuelta a la calma:</b> enfriamiento, elasticidad y balance de la sesión.</p></div><div class="card"><h3>Principios básicos</h3><ul><li>Progresión: más volumen, intensidad, complejidad o tensión.</li><li>Continuidad: 7 días sin entrenar son un 10% de pérdida; 14 días, 35%.</li><li>Carga y recuperación (supercompensación).</li><li>Variedad: evita la monotonía.</li><li>Multilateralidad antes que especialización.</li><li>Individualización: planes por posición o por jugador.</li></ul></div><div class="card"><h3>Periodización</h3><p>Macrociclo (la temporada), mesociclo (3 a 6 semanas, lo más frecuente 4) y microciclo (la semana, formado por sesiones).</p></div><div class="card"><h3>Perfil y comunicación del entrenador</h3><ul><li>Explicación breve y concisa.</li><li>Vocabulario y comunicación constante con el resto de compañeros.</li><li>Puntualidad y organización para preparar la sesión.</li><li>Estilos: mando directo, asignación de tareas, enseñanza recíproca, descubrimiento guiado y resolución de problemas.</li></ul></div>`},
 mod:{n:'Modelo de juego',h:()=>`<div class="card"><h3>Cuatro momentos del juego</h3><ul><li><b>Organización ofensiva:</b> ¿cómo ataco? (combinativo o directo).</li><li><b>Transición defensiva:</b> ¿qué hago cuando pierdo el balón?</li><li><b>Organización defensiva:</b> ¿cómo defiendo? (zonal o mixto).</li><li><b>Transición ofensiva:</b> ¿qué hago cuando recupero?</li></ul><p class="muted">Para cada comportamiento responde: dónde, quiénes y cómo.</p></div><div class="card"><h3>Tipos de ventaja</h3><ul><li><b>Numérica:</b> más jugadores propios que rivales en una zona.</li><li><b>Posicional:</b> posiciones preestablecidas y ritmo que dificultan leer el juego.</li><li><b>Socio-afectiva:</b> complicidad entre compañeros.</li><li><b>Cualitativa:</b> calidad individual.</li></ul></div>`},

function cargaEv(){const E=[];
 (S.sesiones||[]).forEach(s=>{const au={};Object.entries(s.rpe||{}).forEach(([j,r])=>{if(+r>0&&s.asis?.[j]!=='a'&&s.asis?.[j]!=='j'&&s.asis?.[j]!=='l')au[j]=+r*sDur(s)});E.push({fecha:s.fecha,tipo:'s',id:s.id,label:s.obj||s.cat||'Sesión',au,hasR:Object.keys(s.rpe||{}).length>0,past:s.fecha<=todayS()})});
 (S.partidos||[]).forEach(p=>{const au={};if(+p.rpe>0)Object.entries(p.mins||{}).forEach(([j,m])=>{if(+m>0)au[j]=+p.rpe*(+m)});E.push({fecha:p.fecha,tipo:'p',id:p.id,label:'Partido vs '+(p.rival||''),au,hasR:+p.rpe>0,past:p.fecha<=todayS()})});
 return E}
const sumJ=(E,j)=>E.reduce((a,e)=>a+(j==='todos'?avg(S.jugadores.map(x=>e.au[x.id]||0)):(e.au[j]||0)),0);
function loadWeek(E,mon,j){const f=E.filter(e=>e.fecha>=mon&&e.fecha<=addD(mon,6));return Math.round(sumJ(f,j))}
function acwr(E,mon,j){const a=loadWeek(E,mon,j);const c=[1,2,3,4].map(i=>loadWeek(E,addD(mon,-7*i),j));const nz=c.filter(x=>x>0);if(nz.length<3)return null;return+(a/avg(c)).toFixed(2)}
function acwrTag(v){if(v==null)return'<span class="muted">—</span>';const[t,c]=v<.8?['Baja','']:v<=1.3?['Óptima','']:v<=1.5?['Atención','am']:['Riesgo','rd'];return`<span class="tag ${c}">${v.toFixed(2)} · ${t}</span>`}
function monot(E,mon,j){const d=[];for(let i=0;i<7;i++){const f=addD(mon,i);d.push(sumJ(E.filter(e=>e.fecha===f),j))}const m=avg(d),sd=Math.sqrt(avg(d.map(x=>(x-m)**2)));return{mono:sd>0?+(m/sd).toFixed(1):null,tens:sd>0?Math.round(d.reduce((a,b)=>a+b,0)*m/sd):null,d}}
function rpeAdvice(E,mon){const L=[];const T=loadWeek(E,mon,'todos'),P=loadWeek(E,addD(mon,-7),'todos');
 const pend=E.filter(e=>e.fecha>=mon&&e.fecha<=addD(mon,6)&&e.past&&!e.hasR);
 if(pend.length)L.push(['warn',`Faltan RPE en ${pend.length} ${pend.length>1?'sesiones/partidos':'sesión/partido'} de la semana. Anótalos justo después (en los 20-30 minutos siguientes) para que sean fiables.`]);
 if(T&&P){const v=Math.round((T-P)/P*100);if(v>30)L.push(['warn',`La carga media del equipo sube un ${v}% respecto a la semana anterior. Evita subidas bruscas: aumenta de forma progresiva y deja recuperación.`]);else if(v<-35)L.push(['tip',`La carga baja un ${Math.abs(v)}% respecto a la semana anterior. Si no es una semana de descarga planificada, recuerda que 7 días sin entrenar suponen un 10% de pérdida de condición (Metodología N1).`]);else L.push(['ok',`Variación del ${v>0?'+':''}${v}% respecto a la semana anterior, dentro de un rango razonable.`])}
 const risk=S.jugadores.filter(j=>{const a=acwr(E,mon,j.id);return a!=null&&a>1.5});if(risk.length)L.push(['warn',`Carga aguda muy por encima de la habitual en: ${risk.map(j=>j.nombre).join(', ')}. Valora reducir su volumen o darles más descanso.`]);
 const hi=E.filter(e=>e.fecha>=mon&&e.fecha<=addD(mon,6)).map(e=>{const v=Object.keys(e.au).length?avg(Object.keys(e.au).map(k=>e.au[k]/(e.tipo==='s'?sDur((S.sesiones.find(s=>s.id===e.id)||{})):1))):0;return v});
 const m=monot(E,mon,'todos');if(m.mono&&m.mono>2)L.push(['tip',`Monotonía alta (${m.mono}): los días se parecen demasiado. Alterna sesiones duras y suaves (variedad y carga/recuperación).`]);
 L.push(['tip','Con niños de 8-9 años usa el RPE como orientación, no como medida exacta: pregunta con palabras sencillas (fácil, normal, duro, muy duro) y hazlo en grupo con el entrenador como guía.']);return L}

let fsDir=null,fsPend=null,fsBak='';
const FS_OK=typeof window.showDirectoryPicker==='function';
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open('pizarra-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function idbGet(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch{return null}}
async function idbSet(v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction('h','readwrite');v?t.objectStore('h').put(v,'dir'):t.objectStore('h').delete('dir');t.oncomplete=ok;t.onerror=ok})}catch{}}
async function fsLeer(h){try{const f=await (await h.getFileHandle('pizarra-datos.json')).getFile();return JSON.parse(await f.text())}catch{return null}}
async function fsEscribir(){if(!fsDir)return;try{
 const w=await (await fsDir.getFileHandle('pizarra-datos.json',{create:true})).createWritable();await w.write(JSON.stringify(S,null,2));await w.close();
 const hoyS=todayS();if(fsBak!==hoyS){const cd=await fsDir.getDirectoryHandle('copias',{create:true});const w2=await (await cd.getFileHandle('pizarra-'+hoyS+'.json',{create:true})).createWritable();await w2.write(JSON.stringify(S));await w2.close();fsBak=hoyS;
  const n=[];for await(const [k] of cd.entries())if(/^pizarra-\d{4}-\d{2}-\d{2}\.json$/.test(k))n.push(k);n.sort();while(n.length>30)await cd.removeEntry(n.shift())}
 estado('Guardado en carpeta «'+fsDir.name+'»')}catch(e){estado('No se pudo escribir en la carpeta');}}
async function fsInit(){if(!FS_OK)return;const h=await idbGet();if(!h)return;let p='prompt';try{p=await h.queryPermission({mode:'readwrite'})}catch{}
 if(p==='granted'){fsDir=h;const d=await fsLeer(h);if(d)Object.assign(S,d);estado('Guardado en carpeta «'+h.name+'»')}
 else{fsPend=h;const e=document.getElementById('estado');if(e){e.textContent='Pulsa aquí para reconectar la carpeta «'+h.name+'»';e.classList.add('warn');e.style.cursor='pointer';e.onclick=fsReconectar}}}
async function fsReconectar(){const h=fsPend;if(!h)return;try{if(await h.requestPermission({mode:'readwrite'})!=='granted')return}catch{return}
 fsDir=h;fsPend=null;const d=await fsLeer(h);if(d){Object.assign(S,d);}const e=document.getElementById('estado');if(e){e.style.cursor='';e.onclick=null;e.classList.remove('warn')}save();nav();R[tab]();toast('Carpeta reconectada')}
async function fsElegir(){try{const h=await showDirectoryPicker({mode:'readwrite',id:'pizarra',startIn:'documents'});

function tacAsignar(jid){const e=tac.els[tac.sel],j=S.jugadores.find(x=>x.id===jid);if(!e)return;if(j){e.j=j.id;e.n=String(j.dorsal||'');e.nom=j.nombre.split(' ')[0];e.gk=/portero/i.test(j.pos||'')}else{delete e.j}tacDraw()}

['Regla 2 · El balón',['Esférico, de cuero o material adecuado; 68 a 70 cm de circunferencia y 410 a 450 g.','En la Federación: el nº 3 para chupetines y prebenjamines, el nº 4 para benjamines y alevines y el nº 5 para el resto.','El equipo organizador debe poner al menos 3 balones a disposición del árbitro.','Si el balón se estropea con el juego en marcha, se detiene y se reanuda con balón a tierra. Si ocurre en un penal antes de tocar poste, travesaño o jugador, se repite.','Jugadores y técnicos no salen a recoger el balón; lo hace quien disponga el club organizador.']],
['Regla 3 · Los jugadores',['Máximo 11 jugadores por equipo, uno de ellos portero. No se comienza ni se continúa con menos de 7.','El número de sustituciones y suplentes lo marca la competición. En fútbol 7 benjamín de la RFFM, hasta 14 jugadores por partido y los sustituidos pueden volver (ver la pestaña Fútbol 7 benjamín).','El capitán no tiene privilegios, solo responsabilidad sobre la conducta del equipo.','Sustituciones: con el juego detenido, por la línea central y cuando el sustituido ya ha salido, con permiso del árbitro. El sustituido sale por el punto más cercano de la línea.','Si un sustituto entra sin permiso: amonestación y se le hace salir. Una persona extra o externa que interfiere detiene el juego.']],
['Regla 4 · Equipamiento',['Nada peligroso: no se permiten joyas, anillos, pulseras ni pendientes, y no se tapan con cinta, se quitan.','Obligatorio: camiseta con mangas, pantalón corto, medias, espinilleras cubiertas por las medias y calzado de fútbol.','En benjamín (RFFM) las espinilleras no son obligatorias, pero se recomiendan: obligatorias solo en aficionados, juveniles y cadetes.','Los colores de los dos equipos deben diferenciarse entre sí y del árbitro; los porteros, de todos.','Sin lemas, mensajes ni imágenes en la ropa. Si pierde el calzado o la espinillera por accidente, se la pone lo antes posible.']],
['Regla 5 · El árbitro',['Autoridad total; sus decisiones sobre el juego son definitivas. Solo puede rectificar si no ha reanudado el juego.','Lesión leve: deja continuar. Lesión grave: detiene el juego. El jugador con hemorragia sale y solo vuelve cuando el árbitro comprueba que ha dejado de sangrar; sin manchas de sangre en la ropa.','Un lesionado atendido en el campo debe salir y volver con permiso del árbitro, una vez reanudado el juego (ver Cambios 2026/27: un minuto fuera).','Excepciones para ser atendido dentro: lesión del portero, choque portero y jugador, choque de varios jugadores del mismo equipo, lesión grave, lesión por falta con tarjeta, o el lanzador de un penal.','Puede aplicar ventaja y volver atrás si no llega a producirse.']],
['Regla 6 · Otros miembros del equipo arbitral',['Árbitros asistentes, cuarto árbitro, asistentes adicionales, asistente de reserva, VAR y AVAR.','Actúan bajo la dirección del árbitro, que puede prescindir de ellos por interferencia o conducta incorrecta.','Los asistentes señalan salidas del balón, fuera de juego y sustituciones; el cuarto árbitro supervisa sustituciones, equipamiento y balones de reserva, e indica el tiempo mínimo añadido.']],
['Regla 7 · Duración del partido',['Dos tiempos iguales de 45 minutos. Según tus apuntes, en base: cadetes 80, infantiles 70, alevines de fútbol 11 60. En fútbol 7 benjamín de la RFFM son dos tiempos de 25 minutos (50 en total); tus apuntes decían 40 y el reglamento oficial prevalece.','Descanso: entre 10 y 15 minutos como máximo. Pausas de hidratación (hasta 1 min) y de refresco (de 90 s a 3 min) con calor y humedad, si la competición lo prevé.','Se recupera el tiempo perdido por sustituciones, lesiones, pérdidas de tiempo, sanciones y pausas. El cuarto árbitro indica el mínimo; el árbitro decide.','Un penal se ejecuta aunque haya terminado el tiempo.']],
['Regla 8 · Inicio y reanudación',['Sorteo con moneda: quien gana elige saque o campo. Tras un gol saca el rival que lo recibió.','Saque inicial: todos en su mitad y los rivales a 9,15 m del balón. Se puede marcar directo en la portería contraria.','Balón a tierra: para el equipo que tenía la posesión, y si estaba en el área penal, para el portero defensor. Los demás jugadores a 4 m.','Si el balón a tierra toca a un jugador antes del suelo o sale sin que nadie lo toque, se repite.']],
['Regla 9 · Balón en juego o fuera',['Fuera de juego: cuando sale completamente por la línea de meta o de banda, por el suelo o por el aire, o cuando el árbitro detiene el juego.','Está en juego cuando rebota en poste, travesaño o banderín y permanece dentro, y en la mayoría de contactos con el árbitro.','Un balón que ha salido solo en parte sigue en juego.']],
['Regla 10 · Resultado del partido',['Gol válido: el balón cruza completamente la línea entre los postes y bajo el travesaño, sin falta previa.','Si el portero lanza el balón con la mano y entra directo en la portería contraria, saque de meta.','Si hay que desempatar: goles fuera, prórroga (dos periodos de máximo 15 minutos) o tanda de penales, solos o combinados.','Tanda: cinco lanzadores entre los jugadores que estaban en el campo al terminar; los expulsados no participan.']],
['Regla 11 · Fuera de juego',['Posición: más cerca de la línea de meta contraria que el balón y el penúltimo adversario, con cabeza, cuerpo o pies (los brazos no cuentan).','No hay posición de fuera de juego en la propia mitad ni a la misma altura que el penúltimo o los dos últimos adversarios.','Estar en posición no es infracción: lo es si además interfiere en el juego, interfiere a un adversario o gana ventaja de esa posición.','No hay fuera de juego en un saque de meta, de banda o de esquina.']],
['Regla 12 · Faltas y conducta incorrecta',['Tiro libre directo por siete infracciones cometidas de forma imprudente, temeraria o con fuerza excesiva: patada, zancadilla, salto, carga, golpe, empujón y entrada.','Más cinco que se sancionan solo por haber ocurrido: mano, sujetar, obstaculizar con contacto, morder o escupir y lanzar un objeto. Dentro del área propia, penal.','Indirecto: juego peligroso, obstaculizar sin contacto, protestar con lenguaje ofensivo, impedir al portero soltar el balón, y las del portero (retener más de seis segundos).','Mano: es infracción si el brazo está en posición antinatural o por encima del hombro, o si se marca gol con ella aunque sea accidental.','Imprudente: sin tarjeta. Temeraria: amarilla. Fuerza excesiva: roja. Rojas: impedir un gol con la mano, ocasión manifiesta de gol, juego brusco grave, conducta violenta, escupir o morder, lenguaje ofensivo y segunda amarilla.']],
['Regla 13 · Tiros libres',['Directo (se puede marcar) o indirecto (el árbitro levanta el brazo hasta que lo toque otro jugador).','Balón inmóvil y rivales a 9,15 m. El ejecutor no puede tocarlo dos veces seguidas: indirecto, o directo si es con la mano.','Un directo que entra en la propia portería es saque de esquina; un indirecto directo a portería contraria, saque de meta.']],
['Regla 14 · El penal',['Se concede por una de las 12 infracciones de tiro libre directo cometidas por el defensor en su área con el balón en juego.','Balón inmóvil en el punto penal. El portero sobre la línea, frente al ejecutor y sin tocar los postes.','El resto, fuera del área, a 9,15 m y detrás del punto. El ejecutor golpea hacia delante y no repite toque hasta que otro jugador lo toque.','Si el portero adelanta y para, se repite; si el ejecutor infringe y hay gol, se repite.']],
['Regla 15 · Saque de banda',['Lo saca el rival del último que tocó el balón antes de salir por la banda.','Con las dos manos, desde atrás y por encima de la cabeza, de frente al campo y con parte de cada pie sobre la línea o fuera. Rivales a 2 m.','No hay fuera de juego ni gol directo: en propia puerta, esquina; en la contraria, saque de meta.','Tocar dos veces seguidas el balón: indirecto, o directo si es con la mano.']],
['Regla 16 · Saque de meta',['Cuando el balón sale por la línea de meta tocado por último por un atacante.','Se saca desde cualquier punto del área de meta; está en juego al ser golpeado y moverse con claridad. Rivales fuera del área penal hasta entonces.','Gol directo solo en portería contraria. No hay fuera de juego.']],
['Regla 17 · Saque de esquina',['Cuando el balón sale por la línea de meta tocado por último por un defensor.','Balón en el cuadrante de esquina más cercano; no se puede retirar el banderín. Rivales a 9,15 m.','Gol directo solo en la portería contraria. No hay fuera de juego.']]];

const CAMB=[
['Sustituciones con límite de tiempo (Regla 3)',['El jugador sustituido debe salir en diez segundos desde que se muestra el cartel o la señal del árbitro.','Si no sale a tiempo, el sustituto no puede entrar hasta la primera interrupción tras un minuto de tiempo real desde la reanudación.','El sustituido solo se amonesta si retrasa en exceso más allá de los diez segundos. La sustitución no se puede cancelar.','El portero debe salir por la línea de meta; si tarda, entra el sustituto y se amonesta al portero.']],
['Accesorios (Regla 4)',['Se permiten artículos no peligrosos si están cubiertos de forma segura y firme. Los artículos peligrosos, entre ellos los metálicos o similares, siguen prohibidos.']],
['Lesiones: tratamiento y evaluación (Regla 5)',['El jugador tratado o evaluado en el campo, o que provoca la detención o el retraso del juego, sale y espera un minuto de tiempo real tras la reanudación.','Excepciones: lesión de portero, choque con portero, choque de varios del mismo equipo, lesión por falta sancionada con tarjeta o lanzador de penal lesionado; o si el jugador indica que no necesita atención, o sale por su cuenta sin retrasar.','Lesión en la cabeza: tras el reconocimiento el jugador sale un minuto, para valorar si es seguro que siga jugando. Si se confirma que no es grave y no recibió asistencia médica en el campo, puede volver sin esperar.']],
['Ventaja en reanudaciones (Regla 5)',['El árbitro puede aplicar ventaja si un equipo hace mal una reanudación (libre, banda, etc.) y los rivales obtienen posesión positiva; si no hay ventaja, sanciona o hace repetir.']],
['Balón a tierra (Regla 8)',['Se deja caer para el equipo que habría mantenido la posesión, o que habría reanudado si el balón hubiera salido. En el área penal, para el portero.','Se deja caer donde estaba el balón al detenerse, salvo contacto con el equipo arbitral o un agente externo.']],
['Doble toque en el penal (Regla 10)',['Si el lanzador toca el balón dos veces de forma accidental: si entra, se repite; si no entra, se registra como fallado o se concede indirecto.']],
['Retrasar la reanudación (Regla 12)',['El árbitro puede conceder el saque de banda al contrario cuando se retrasa uno, y un saque de esquina al contrario cuando se retrasa un saque de meta. Se considera sanción suficiente salvo retrasos extremos.','Ocasión manifiesta de gol: si el árbitro aplica ventaja y se marca gol, no se amonesta ni expulsa. Pesa también la ubicación y el número de atacantes.']],
['Cuenta atrás de cinco segundos (Reglas 15 y 16)',['Si se retrasa a propósito un saque de banda o de meta, el árbitro silba, señala que se saque e inicia una cuenta atrás visual de cinco segundos.','Si no se saca al terminar: saque de banda para el contrario, o saque de esquina para el contrario si era de meta.']],
['Saque de meta y mano (Regla 16)',['Si el balón inmóvil en el área de meta es pateado por un defensor, el saque está ejecutado. Si lo juega el portero y un compañero lo toca deliberadamente con la mano dentro del área, penal.']],
['VAR',['Nuevos revisables: tarjeta roja por segunda amarilla claramente incorrecta, error de identidad al mostrar una tarjeta y saque de esquina claramente mal concedido (si se puede corregir sin retrasar la reanudación).']]];

const AUX=[
['Primero: PAS',['Proteger: hacer seguro el lugar. Es preferible alejar el peligro que mover al jugador.','Avisar: llama al 112.','Socorrer: primero salvar la vida, después evitar que se agraven las lesiones.']],
['No responde y no respira: RCP',['Comprueba si está consciente y si respira. Abre la vía aérea con la maniobra frente-mentón; si sospechas golpe en la cabeza o el cuello, con elevación de la mandíbula, sin mover la cabeza.','Llama al 112 y pide un desfibrilador (DEA) si lo hay en la instalación. Avisar pronto es el primer eslabón de la cadena de supervivencia.','En niños: 5 ventilaciones boca a boca al principio; después 30 compresiones por 2 ventilaciones. Comprime un tercio de la profundidad del tórax, con una o dos manos.','No te detengas hasta que lleguen los servicios de emergencia o respire.']],
['Atragantamiento',['Consciente y tose: anímale a toser con fuerza, sin palmadas.','Consciente sin poder toser: 5 palmadas entre los omoplatos; si no funciona, 5 compresiones de Heimlich (puño en la boca del estómago, hacia dentro y hacia arriba).','Inconsciente: abre la vía aérea, mira la boca (solo extrae el objeto si es accesible) y empieza con 30 compresiones y 2 ventilaciones.']],
['Hemorragia',['Compresión directa con gasa o compresa (con guantes) y vendaje de presión. La mayoría se controla así.','Eleva la parte lesionada por encima del corazón. Si no cede, 112.','Hemorragia por la nariz: comprime la fosa que sangra, inclina la cabeza hacia delante, frío en la nuca y, si hace falta, gasa. Si no para, valoración médica.']],
['Heridas y rozaduras',['Limpia con suero fisiológico y cubre. Lávate las manos y usa guantes.','Herida compleja: no quites cuerpos extraños incrustados, no explores dentro, presiona con gasa, cubre con venda y acude a un centro médico. No retires el apósito puesto.']],
['Golpe o contusión',['Reposo de la zona y hielo sobre un paño, nunca directo sobre la piel.','Elevar la zona y, si hace falta, compresión con venda elástica sin cortar la circulación.','No pinchar ni romper hematomas. Si hay dolor intenso o dudas de gravedad, tratar como grave y parar la práctica.']],
['Esguince (tobillo)',['Hielo para reducir inflamación y dolor, compresión y elevación.','Si no es grave, se puede ir apoyando poco a poco. Si es grave, sin apoyar y con ayuda para andar; valoración médica.']],
['Luxación o fractura',['Tranquiliza al jugador y evita movimientos innecesarios.','Inmoviliza la articulación por encima y por debajo. Retira anillos, pulseras y relojes.','No intentes recolocar la luxación ni des medicación; hielo y traslado a un centro. Traslado sin movimientos bruscos.']],
['Golpe en la cabeza o el cuello',['No muevas al jugador, sobre todo si está inconsciente. Si lleva casco, no lo retires salvo que lo indique el 112.','Un traumatismo craneal con pérdida de conocimiento se trata como lesión de columna cervical. Si vomita, de lado manteniendo el eje cabeza-cuello-tronco.','Si hay una lesión en la cabeza en el partido, el jugador sale (Regla 5, cambios 2026/27) y no vuelve hasta una valoración.']],
['Calor: calambres, golpe de calor',['Calambres: parar, estirar suave y rehidratar.','Golpe de calor (piel caliente y seca, confusión, dolor de cabeza fuerte, convulsiones, pérdida de conciencia): urgencia médica. Llama al 112, lleva al jugador a la sombra y enfría con compresas frías o agua fresca. No le des de beber mientras esperas.']],
['Convulsiones',['Anota cuánto dura. Retira los objetos de alrededor, afloja la ropa del cuello y pon algo blando bajo la cabeza.','No lo sujetes, no metas los dedos en la boca ni fuerces nada. Llama al 112.']],
['Quemaduras',['Agua fría (de 10 a 20 °C, nunca helada ni hielo) durante 10 a 20 minutos, con chorro suave o sumergiendo.','No frotes con hielo la piel congelada.']],
['Asma, alergia y diabetes',['Asma o alergia: tranquilizar, sentar con el tronco incorporado, aplicar la medicación solo si está prescrita por el médico, separar del desencadenante.','Diabetes: conocer a los jugadores afectados; antes del ejercicio, controlar la glucemia, aportar calorías extra e hidratar bien.']],
['Botiquín del equipo',['Guantes desechables, mascarilla para respiración artificial, suero fisiológico monodosis, gasas y compresas estériles, vendas elásticas y de gasa, esparadrapo y tiritas.','Bolsas de frío instantáneo, manta térmica, tijeras de puntas redondeadas, pinzas sin dientes, pañuelos triangulares, linterna, termómetro y bloc con lápiz.','Los analgésicos y medicamentos solo con indicación médica y sin alergias conocidas.']]];

['Pre-puberal (7 a 8 años) y puberal (9 a 13)',['A los 7-8: más solidaridad en el campo, aceptan críticas constructivas, mejoran la toma de decisiones, la creatividad y la atención; mucha vulnerabilidad emocional.','Desde los 9: gran desarrollo intelectual, ven el fútbol como algo complejo y necesitan mucha motivación personal.','Sesiones de 7-8: empezar con juegos, tareas con balón, espacios grandes, mucha intervención del niño, explicaciones simples y mucho refuerzo positivo.','Sesiones de 9 a 13: etapa sensible para técnica y aprendizaje motor, mucho contacto con el balón, situaciones reducidas y duelos, partidos condicionados («no jugar por jugar»), orientar al jugador en vez de dirigirle y que piensen lo que hacen.']],
['Motivación',['Inicio: por el propio fútbol y por pertenecer a un grupo. Mantenimiento: gusta la práctica, aprender habilidades nuevas y competir. Abandono: otros intereses, no gustarle el entrenador o la presión de la competición.','Intrínseca (satisfacción con la actividad) frente a extrínseca (elogios y premios).','Economía de fichas: premiar con puntos las conductas deseables, definidas de antemano, y canjearlos por premios previstos.']],
['Clima motivacional',['Orientado a la tarea: esfuerzo, hacer lo que antes no se podía y colaborar. Orientado al resultado: ganar y compararse con otros.','Para crear clima de tarea: sesiones con variedad y reto personal, objetivos realistas, reconocimiento, grupos, evaluación y tiempo.']],
['Feedback del entrenador',['Instruccional: directo-evaluativo («así no») o interrogativo («¿por qué crees que el balón salió alto?»). Correctivo: descriptivo, referencias mecánicas, intensidad y percepción.','Método sándwich: empieza por lo positivo, corrige con instrucciones orientadas al futuro y termina con expectativas de éxito.','Nada de comparaciones ni críticas destructivas: mejorar acciones concretas y reforzar los aciertos.']],
['Actitud ante los fallos y normas',['Cada jugador tiene su ritmo; el error es parte del aprendizaje; no perder el control; paciencia; palabras de ánimo.','Normas: pocas, precisas, definidas, adecuadas al equipo, fijadas al principio y con su razón explicada. Las sanciones, pactadas con los jugadores y sin beneficiar al infractor.','Castigar sin jugar contradice lo que se quiere consolidar (la práctica habitual). Una sanción eficaz es inmediata, proporcionada y consistente.']]];

const F7=[
['Qué es y qué manda',['El Reglamento de Fútbol 7 de la RFFM solo regula lo específico de la modalidad. Para cualquier situación no prevista se aplican las Reglas de Juego de la IFAB.','Es un reglamento formativo: el árbitro fomenta el espíritu de juego y puede explicar sus decisiones a los jugadores.','Benjamín 2026/27: nacidos entre el 01-01-2017 y el 31-12-2018. Se permite fútbol mixto.']],
['Campo y portería',['Rectángulo de 40 a 60 m de largo (o el ancho de un campo de fútbol 11) por 30 a 40 m de ancho; el largo siempre mayor que el ancho. Líneas de 8 cm. Círculo central de 6 m de radio.','Portería de 6 m de ancho por 2 m de alto, con postes de 8 cm.','Área de meta: a 3 m de cada poste y 4,30 m de profundidad. Área de penalti: a 9 m de cada poste y 11 m de profundidad. Punto de penalti a 9 m.','Zona de fuera de juego: línea a 13 m de la línea de meta. Esquinas: arco de 60 cm de radio.']],
['Balón',['Número 4 oficial de la RFFM (Kromex), de 63,5 a 66 cm de circunferencia y 350 a 390 g.','Lo pone el equipo local; el club organizador debe ofrecer al árbitro al menos tres.']],
['Jugadores y sustituciones',['Siete jugadores por equipo, uno portero. Se puede empezar con cinco y los demás se incorporan hasta el final del descanso (cuando el árbitro sale al campo).','Hasta 14 jugadores por partido. Los suplentes entran por el centro del campo con permiso del árbitro o del delegado, cuando el jugador a sustituir ya ha salido.','Los sustituidos pueden volver las veces que haga falta, siempre por la zona prevista.','Si un equipo se queda con menos de cinco jugadores en el campo, incluidas las expulsiones temporales, el árbitro da por terminado el partido y lo hace constar en el acta.','Un equipo benjamín puede alinear hasta tres prebenjamines, siempre de último año.']],
['Equipación',['Camiseta, pantalón y medias del mismo color que los compañeros. Espinilleras recomendadas, no obligatorias, en benjamín.','El portero, con colores distintos a sus compañeros, al árbitro y al equipo rival, incluido su portero.','Nada peligroso para él ni para los demás. Las lentes correctoras solo con el documento de homologación de la RFFM.','Si coinciden los colores, el local conserva su primera equipación; el visitante cambia, o solo las camisetas para evitar suspender.']],
['Duración',['Dos tiempos de 25 minutos (50 en total).','Descanso de 5 minutos como máximo si se juega en formato sede y de 10 si es local-visitante. Solo se altera con permiso del árbitro por causas excepcionales.']],
['Inicio y reanudación',['Saque a balón parado, en cualquier dirección. Todos en su campo y los rivales a 6 m del balón.','Tras un gol saca un jugador del equipo contrario. Tras el descanso cambian de campo y saca el equipo que no sacó al empezar.','No es gol válido el marcado directamente de saque de centro ni de saque de portería.']],
['Resultado y clasificación',['Gol: el balón traspasa totalmente la línea de meta entre los postes y bajo el larguero. Puntos: 3 por victoria, 1 por empate y 0 por derrota.','En benjamín no se anotan los goles en el acta: el resultado es 1-0, 0-0 o 0-1 según el ganador.','Desempate en la clasificación: 1) victorias entre los empatados, 2) victorias en toda la competición, 3) resultado del último encuentro entre ellos, 4) menor edad media de los inscritos y 5) sorteo.']],
['Fuera de juego',['Hay fuera de juego dentro de la línea de 13 m, si el jugador está más cerca de la meta contraria que el balón y no hay al menos dos adversarios entre él y la línea de meta.','Solo se sanciona si interfiere en el juego o en un contrario, o saca ventaja de esa posición.','No hay fuera de juego en un saque de meta, de banda o de bote neutral. Se castiga con tiro libre indirecto. (En prebenjamín no existe; en benjamín sí.)']],
['Faltas y sanciones',['Tiro libre directo por patada, zancadilla, salto, carga violenta o peligrosa, golpe, sujetar o empujar, y mano (salvo el portero en su área). Dentro del área propia, penalti.','En benjamín, si la falta es de gravedad superior a lo normal, el infractor es expulsado dos minutos. El árbitro puede expulsar 1 o 2 minutos por una conducta leve inconveniente, y definitivamente por reincidencia o conducta violenta.','Desde campo propio no vale el gol de tiro libre directo: en campo propio, todos los libres son indirectos.','Portero en su área, tiro libre indirecto si controla con las manos, la juega y vuelve a controlarla; recibe una cesión voluntaria de pie de un compañero; o la recibe de un saque de banda de un compañero.','También es indirecto jugar de forma peligrosa, obstaculizar o impedir que el portero saque con las manos.']],
['Tiros libres y penalti',['Rivales a 6 m del balón en los tiros libres; si es desde el propio área de penalti, fuera del área.','Penalti desde 9 m. Todos fuera de la zona de 13 m salvo lanzador y portero. El portero con al menos parte de un pie sobre la línea. El lanzador no toca dos veces seguidas: tiro libre indirecto.']],
['Saques de banda, de meta y de esquina',['Banda: de frente, con una parte de cada pie sobre la línea o fuera, con las manos desde atrás y por encima de la cabeza. No se puede marcar directamente.','Meta: desde cualquier punto del área de meta; en juego al golpearlo y moverse; rivales fuera del área de penalti hasta entonces. No vale gol directo.','Esquina: lo saca un atacante desde la esquina más cercana; rivales a 6 m. Sí vale el gol directo.']]];
