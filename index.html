<style>
:root{--bg:#f4f6f5;--surface:#fff;--surface2:#eef2f0;--ink:#0e1a15;--muted:#5f6f68;--line:#dfe6e2;--accent:#047857;--accent-ink:#fff;--accent-soft:#d9f2e6;--danger:#c42b2b;--shadow:0 1px 2px rgba(14,26,21,.05),0 6px 24px rgba(14,26,21,.06);--r:14px;--side:244px}
[data-theme=dark]{--bg:#0a0f0d;--surface:#121a17;--surface2:#1a2420;--ink:#e9f1ed;--muted:#8fa299;--line:#24312b;--accent:#34d399;--accent-ink:#04261a;--accent-soft:#12312a;--danger:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;font-family:Satoshi,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand i svg{width:18px;height:18px;stroke:var(--accent-ink)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:transparent;color:var(--muted);border:0;padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sidefoot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface2);font-size:13px;color:var(--muted)}
.sidefoot b{color:var(--ink);display:block;font-size:13px;margin-bottom:2px}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .sp{flex:1}
.mbrand{display:none;font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip.warn::before{background:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1240px;margin:0 auto;padding:26px 28px 60px}
h2{font-family:'Cabinet Grotesk',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 18px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{margin:0 0 10px;font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:-10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.alt:hover{background:var(--surface2)}
.btn.del{background:transparent;color:var(--danger);padding:5px 9px;margin:0;font-weight:500}
.btn.sm{padding:6px 11px;margin:3px 3px 0 0;font-size:13px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase}tr:last-child td{border-bottom:0}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.g{background:var(--accent-soft);color:var(--accent)}.tag.o{background:var(--surface2);color:var(--muted)}
.part{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0}.part.c{border-color:#e0a21b}.part.v{border-color:#4f8fc0}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:32px 16px;border:1.5px dashed var(--line);border-radius:var(--r);background:transparent}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.kpi-card .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi-card .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi{font-family:'Cabinet Grotesk',sans-serif;font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px}
.kpi-card small{color:var(--muted);font-size:13px}
.hero{border-radius:20px;padding:26px 28px;margin-bottom:22px;background:linear-gradient(135deg,#065f46,#047857 55%,#0e9f6e);color:#fff;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:280px;height:280px;border-radius:50%;border:30px solid rgba(255,255,255,.07)}
.hero h2{color:#fff;margin:0 0 4px;font-size:30px}.hero p{margin:0;opacity:.85}
.hero .btn{background:#fff;color:#065f46;margin:0}.hero .btn.alt{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.scroll{overflow-x:auto}
.task{display:grid;grid-template-columns:1fr 80px 36px;gap:8px;margin-top:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.sec h3{margin:0;font-size:17px}
.sec a{color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.ed{grid-template-columns:1fr}}
.pitch{background:#0b1f12;border-radius:16px;overflow:hidden;line-height:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.pitch svg{width:100%;height:auto;touch-action:none;user-select:none}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;align-items:center}
.pal button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s}
.pal button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pal .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:0 4px 0 10px}.pal .lab:first-child{margin-left:0}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.ctl select,.ctl input{width:auto;padding:5px 8px;border-radius:8px}
.fh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 2px 6px}
.fb{background:transparent}
.fb textarea,.fb input{background:var(--surface)}
.fb.big textarea{min-height:130px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.f4 .fh{padding-top:0}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tit{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 14px;box-shadow:var(--shadow)}
.tit span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}.tit input{border:0;background:transparent;font-family:'Cabinet Grotesk',sans-serif;font-size:20px;font-weight:700;box-shadow:none!important}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.hcard:hover{transform:translateY(-3px)}
.hcard .th{line-height:0;background:#0b1f12}.hcard .th svg{width:100%;height:auto}
.hcard .b{padding:14px 16px 12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .22s;z-index:50;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
[data-theme=light] .toast button{color:#34d399}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;height:96px}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pal2{margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}.pal2 summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px}
.icog{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;padding:4px 0 12px}
.icog button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#2c3a33;border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;cursor:pointer;color:#e9f1ed;font:inherit;font-size:11px;line-height:1.15;text-align:center}
.icog button:hover{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.icog img{height:40px;width:auto;max-width:72px;object-fit:contain}
.asis-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.asis-h .sp{flex:1}
.asis-l{display:grid;gap:4px;max-height:300px;overflow:auto}
.asis-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.asis-b{display:flex;gap:4px}.asis-b button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-width:44px}
.asis-b .as-p.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.asis-b .as-a.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.asis-b .as-j.on{background:#e0a21b;color:#2a1d00;border-color:#e0a21b}
.asis-b .as-l.on{background:#6b7fd7;color:#fff;border-color:#6b7fd7}
.asb{font-style:normal;font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 6px;margin-left:4px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;display:inline-block}.d-p{background:var(--accent)}.d-a{background:var(--danger)}.d-j{background:#e0a21b}.d-l{background:#6b7fd7}
.tt{display:flex;gap:12px;align-items:center;margin:8px 0}.ttv{flex:none;width:240px;cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.ttv svg{display:block;width:100%;height:auto}@media(max-width:600px){.tt{flex-direction:column;align-items:stretch}.ttv{width:100%}}
.adv{display:grid;gap:8px}.adv-i{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.adv-i p{margin:2px 0 4px;font-size:14px}.adv-i small{color:var(--muted);font-size:12px}
.adv-ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.adv-i.warn{border-color:#e0a21b}.adv-i.warn .adv-ic{background:#e0a21b;color:#2a1d00}.adv-i.ok .adv-ic{background:var(--accent);color:var(--accent-ink)}
.adv{padding:8px 12px;border-radius:10px;margin:6px 0;background:var(--surface2);border-left:3px solid var(--accent)}.adv.warn{border-color:var(--danger)}.adv.tip{border-color:#e0a21b}.guia .card ul{margin:6px 0;padding-left:20px}.guia .card li{margin:3px 0}
@media(max-width:860px){
 .asis-r{flex-direction:column;align-items:stretch}
 .kpis{grid-template-columns:1fr 1fr}.kpi-card{padding:12px;gap:10px}.kpi-card .ic{width:36px;height:36px}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);flex-direction:row;gap:0}
 .brand,.sidefoot{display:none}
 nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px;scrollbar-width:none}
 nav button{flex-direction:column;gap:3px;padding:7px 11px;font-size:11px;white-space:nowrap;flex:none;align-items:center}
 .topbar{padding:10px 16px}.mbrand{display:block}
 main{padding:18px 16px 110px}
 h2{font-size:24px}.hero{padding:20px}.hero h2{font-size:24px}
}
@media print{.side,.topbar,.noprint,.pal,.ctl,.toast{display:none!important}.shell{display:block}body{background:#fff}}

.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.calbar .sp{flex:1}.navs{display:flex;gap:6px;align-items:center}.ctit{font-family:'Cabinet Grotesk',sans-serif;font-size:20px;text-transform:capitalize}
.leg{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:8px}.leg i.s,.ev.s{--c:var(--accent)}.leg i.p,.ev.p{--c:#e0a21b}.leg i{background:var(--c)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px;text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:110px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:4px}
.cgrid.semana .cd{min-height:280px}.cd:hover{border-color:var(--accent)}.cd.over{background:var(--accent-soft);border-color:var(--accent)}
.cd.fuera{opacity:.45}.cd.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cd.hoy .dn b{background:var(--accent);color:var(--accent-ink)}
.dh{display:flex;justify-content:space-between;align-items:center}.dn{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600}.dn b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px;font-size:13px;color:var(--ink);padding:0 4px}
.add{opacity:0;border:0;background:var(--surface2);color:var(--ink);width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1}.cd:hover .add{opacity:1}

.cgrid.semana .ev{white-space:normal;font-size:13px;padding:6px 8px}.more{font-size:12px;color:var(--muted)}

.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:18px}
.evrow{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.evrow:hover{border-color:var(--accent)}
@keyframes fi{from{opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
.delta{font-weight:700;color:var(--muted)}.delta.up{color:var(--accent)}.delta.dn{color:var(--danger)}
@media(max-width:860px){.cgrid.semana{grid-template-columns:1fr}.cgrid.semana .cd{min-height:0}.cgrid.mes{gap:4px}.cgrid.mes .cd{min-height:64px;padding:5px;gap:3px}.cgrid.mes .ev{font-size:0;padding:0;width:8px;height:8px;border-radius:50%;border:0;background:var(--c);display:inline-block}.cgrid.mes .more{font-size:10px}.dow{gap:4px}.cgrid.mes .add{display:none}.cgrid.semana .add{opacity:1}.calbar .sp,.leg{display:none}}

<body>
<div class="shell"><aside class="side"><div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/></svg></i>Pizarra</div><nav id="nav" aria-label="Secciones"></nav><div class="sidefoot"><b>Consejo</b>Registra cada tarea que uses para ver qué trabajas más.</div></aside>
<div class="content"><div class="topbar"><span class="mbrand">Pizarra</span><span class="sp"></span><span class="chip" id="estado">Cargando…</span><button class="icon-btn" id="theme" aria-label="Cambiar tema" onclick="toggleTheme()"></button></div><main id="app"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main></div></div><div class="toast" id="toast"></div>
<script>window.__API_BASE__='__PORT_8000__';</script>
<script>
const K='pizarra-v1';
const S={jugadores:[],sesiones:[],pruebas:[],planes:[],tareas:[],uso:[],partidos:[]};
const _raw=window.__API_BASE__,_un=_raw.startsWith('__PORT_');
const API=_un?'http://localhost:8000':_raw;
let _t,MODO='api';
const lsGet=()=>{try{const v=localStorage.getItem(K);return v?JSON.parse(v):null}catch{return null}};
const lsSet=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch{return false}};
const lkGet=()=>{try{const v=localStorage.getItem('pizarra-lock');return v?JSON.parse(v):null}catch{return null}};
const lkSet=o=>{try{o?localStorage.setItem('pizarra-lock',JSON.stringify(o)):localStorage.removeItem('pizarra-lock');return true}catch{return false}};
const save=()=>{estado('Guardando…');clearTimeout(_t);_t=setTimeout(async()=>{const ok=lsSet();fsEscribir();gdEscribir();if(MODO!=='api'){estado(ok?'Guardado en este dispositivo':'Sin conexión: no guardado');return}try{const r=await fetch(API+'/api/datos',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});if(!r.ok)throw 0;estado('Guardado')}catch{estado(ok?'Guardado en este dispositivo':'Sin conexión: no guardado')}},400)};
function estado(t){const e=document.getElementById('estado');if(e){e.textContent=t;e.classList.toggle('warn',/Sin conexi|No se pudieron/.test(t))}}
async function cargar(){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),2500);const r=await fetch(API+'/api/datos',{signal:c.signal});clearTimeout(to);if(!r.ok)throw 0;const d=await r.json();Object.assign(S,d);MODO='api';estado('Todo al día')}catch{MODO='local';const d=lsGet();if(d)Object.assign(S,d);estado('Guardado en este dispositivo')}}
const id=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const TABS={inicio:'Inicio',calendario:'Calendario',sesiones:'Sesiones',partidos:'Partidos',jugadores:'Jugadores',fisica:'Preparación física',pruebas:'Pruebas físicas',evolucion:'Evolución',editor:'Editor de tareas',historico:'Histórico',datos:'Datos'};
let tab='inicio';
const IC={inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',jugadores:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.2.6 3.5 2.4 3.5 6"/>',sesiones:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/>',fisica:'<path d="M3 12h2M19 12h2M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/>',pruebas:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',editor:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/>',historico:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9M10 13h4"/>',datos:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',calendario:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4M8 14h2M14 14h2M8 17h2"/>',partidos:'<path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8"/>',evolucion:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
function nav(){$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" ${k==tab?'aria-current="page"':''} onclick="go('${k}')">${ico(k)}<span>${v}</span></button>`).join('')}
let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
function applyTheme(){document.documentElement.dataset.theme=theme;const b=$('#theme');if(b)b.innerHTML=ico(theme==='dark'?'sun':'moon')}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();if(tab==='evolucion')R.evolucion()}
let _tt;function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?' <button id="tu">Deshacer</button>':'');t.classList.add('on');if(undo)$('#tu').onclick=()=>{undo();t.classList.remove('on')};clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),undo?5000:2200)}
const emptyS=(t,d)=>`<div class="empty"><b>${t}</b>${d}</div>`;
function go(t){if(typeof killCharts==='function')killCharts();tab=t;nav();R[t]();scrollTo(0,0)}
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}):''
const jName=i=>(S.jugadores.find(j=>j.id==i)||{}).nombre||'—';
const jOpts=(sel)=>S.jugadores.map(j=>`<option value="${j.id}" ${j.id==sel?'selected':''}>${esc(j.nombre)}</option>`).join('');
const fd=v=>Object.fromEntries(new FormData(v));

const R={
inicio(){const hoyS=new Date().toISOString().slice(0,10);const prox=[...S.sesiones].sort((a,b)=>a.fecha<b.fecha?-1:1).filter(s=>s.fecha>=hoyS).slice(0,3);
const rec=[...(S.tareas||[])].sort((a,b)=>(b.editada||'')>(a.editada||'')?1:-1).slice(0,3);
const K=(ic,n,t,g)=>`<div class="kpi-card" ${g?`onclick="go('${g}')" style="cursor:pointer" role="button" tabindex="0"`:''}><div class="ic">${ico(ic)}</div><div><div class="kpi">${n}</div><small>${t}</small></div></div>`;
const nom=nombreVista(),hh=new Date().getHours(),sal=hh<13?'Buenos días':hh<20?'Buenas tardes':'Buenas noches';const pp=[...(S.partidos||[])].filter(p=>p.fecha>=hoyS).sort((a,b)=>a.fecha<b.fecha?-1:1);const sem=S.sesiones.filter(x=>x.fecha>=hoyS&&x.fecha<=addD(hoyS,6)).length;
const CH=(t,g)=>`<span onclick="${/^\w+\(/.test(g)?g:`go('${g}')`}" style="cursor:pointer;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:99px;font-size:13px;white-space:nowrap">${t}</span>`;
const chips=[prox[0]?CH('Pasar lista · '+esc(fmt(prox[0].fecha)),"abrirEv('s','"+prox[0].id+"')"):'',prox[0]?CH('Próxima sesión: '+esc(fmt(prox[0].fecha))+(prox[0].hora?' · '+esc(prox[0].hora):''),'calendario'):'',pp[0]?CH('Próximo partido: '+esc(pp[0].rival||'Rival')+' · '+esc(fmt(pp[0].fecha)),'partidos'):'',CH('Esta semana: '+sem+' sesión'+(sem==1?'':'es'),'calendario'),CH('Carga semanal','carga')].join('');
$('#app').innerHTML=`<div class="hero"><div><h2>${sal}, ${esc(nom||'entrenador')}</h2><p>${S.sesiones.length||pp.length?'Tienes '+prox.length+' sesión'+(prox.length==1?'':'es')+' próxima'+(prox.length==1?'':'s')+' y '+pp.length+' partido'+(pp.length==1?'':'s')+' por jugar. <a onclick="cambiarNombre()" style="cursor:pointer;text-decoration:underline;opacity:.85">'+(nom?'Cambiar nombre':'Poner mi nombre')+'</a>':'Empieza preparando tu primera sesión. <a onclick="cambiarNombre()" style="cursor:pointer;text-decoration:underline;opacity:.85">Poner mi nombre</a>'}</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${chips}</div></div><div class="acts"><button class="btn" onclick="ed=nuevaTarea();go('editor')">${ico('plus')}Nueva tarea</button><button class="btn alt" onclick="go('sesiones')">Planificar sesión</button><button class="btn alt" onclick="formPartido(todayS())">Nuevo partido</button><button class="btn alt" onclick="go('jugadores')">Añadir jugador</button></div></div>
<div class="kpis">${K('jugadores',S.jugadores.length,'jugadores','jugadores')}${K('sesiones',S.sesiones.length,'sesiones','sesiones')}${K('fisica',S.planes.length,'planes físicos','fisica')}${K('pruebas',S.pruebas.length,'pruebas','pruebas')}${K('partidos',(S.partidos||[]).length,'partidos','partidos')}${K('historico',(S.tareas||[]).length,'tareas guardadas','historico')}</div>
<div class="sec"><h3>Próximas sesiones</h3><a onclick="go('calendario')">Abrir calendario</a></div>${prox.length?prox.map(cardSesion).join(''):emptyS('Sin sesiones próximas','Planifícalas en el calendario o en «Sesiones».')}
<div class="sec"><h3>Tareas recientes</h3><a onclick="go('historico')">Abrir histórico</a></div><div class="hgrid">${rec.map(t=>`<div class="hcard" style="cursor:pointer" onclick="abrirT('${t.id}')"><div class="th">${svgTarea(t.els||[],t.fondo,'i'+t.id,-1)}</div><div class="b"><b>${esc(t.titulo)}</b><div class="muted" style="font-size:13px">Editada ${fmt(t.editada)}</div></div></div>`).join('')||emptyS('Aún no hay tareas','Dibuja tu primera tarea en el editor.')}</div>`},

jugadores(){$('#app').innerHTML=`<h2>Jugadores</h2><div class="grid" style="grid-template-columns:1fr">
<form class="card" id="f" style="order:2"><h3>Añadir jugador</h3><label>Nombre</label><input name="nombre" required>
<div class="row"><div><label>Dorsal</label><input name="dorsal" type="number"></div><div><label>Posición</label><select name="pos"><option>Portero</option><option>Defensa</option><option>Centrocampista</option><option>Delantero</option></select></div></div>
<div class="row"><div><label>Año nac.</label><input name="anio" type="number"></div><div><label>Peso (kg)</label><input name="peso" type="number" step=".1"></div><div><label>Altura (cm)</label><input name="altura" type="number"></div></div>
<label>Notas (lesiones, observaciones)</label><textarea name="notas"></textarea><button class="btn">Guardar</button></form>
<div class="card scroll" style="min-width:0">${S.jugadores.length?`<table><tr><th>#</th><th>Nombre</th><th>Posición</th><th>Año</th><th>Peso/Alt.</th><th>Partidos</th><th>Minutos</th><th>% min</th><th>Titular</th><th>Goles</th><th>Asist.</th><th>Sesiones</th><th>Faltas</th><th>Just.</th><th>Lesión</th><th>Asist. %</th><th>Notas</th><th></th></tr>${S.jugadores.map(j=>{const e=statsJ(j);return`<tr><td>${esc(j.dorsal)}</td><td><b>${esc(j.nombre)}</b></td><td><span class="tag">${esc(j.pos)}</span></td><td>${esc(j.anio)}</td><td>${esc(j.peso)} / ${esc(j.altura)}</td><td>${e.pj}</td><td>${e.min}</td><td>${e.pm==null?'–':e.pm+'%'}</td><td>${e.tit}</td><td>${e.gol}</td><td>${e.ast}</td><td>${e.ses}</td><td>${e.fal}</td><td>${e.jus}</td><td>${e.les}</td><td>${e.pct==null?'–':e.pct+'%'}</td><td class="muted">${esc(j.notas)}</td><td>${btnEd('jugadores',j.id)}<button class="btn del" onclick="del('jugadores','${j.id}')">Borrar</button></td></tr>`}).join('')}</table>`:emptyS('Aún no hay jugadores','Añade el primero con el formulario.')}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();S.jugadores.push({id:id(),...fd(e.target)});save();R.jugadores()}},

sesiones(){$('#app').innerHTML=`<h2>Sesiones de entrenamiento</h2><form class="card noprint" id="f"><h3>Nueva sesión</h3>
<div class="row"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Hora</label><input type="time" name="hora" value="18:00"></div><div><label>Categoría</label><input name="cat" placeholder="Benjamín, Cadete…"></div><div><label>Microciclo / semana</label><input name="micro"></div></div>
<label>Objetivo principal</label><input name="obj" placeholder="Ej.: transiciones ataque-defensa en 1-2-3-1">
<label>Material</label><input name="mat" placeholder="Balones, conos, petos…">
${['c:Calentamiento','p:Parte principal','v:Vuelta a la calma'].map(x=>{const[k,n]=x.split(':');return`<div class="part ${k}"><b>${n}</b><div id="t_${k}"></div><button type="button" class="btn alt" onclick="addTask('${k}')">+ Tarea</button> <select style="width:auto;display:inline-block;margin-top:10px" onchange="fromHist('${k}',this)"><option value="">+ Del histórico…</option>${(S.tareas||[]).map(t=>`<option value="${t.id}">${esc(t.titulo)}</option>`).join('')}</select></div>`}).join('')}
<button class="btn">Guardar sesión</button></form><div id="lista" style="margin-top:14px"></div>`;
['c','p','v'].forEach(addTask);
$('#f').onsubmit=e=>{e.preventDefault();const f=e.target,d=fd(f);const parts={};['c','p','v'].forEach(k=>{parts[k]=[...f.querySelectorAll('#t_'+k+' .task')].map(r=>({t:r.children[0].value,m:+r.children[1].value||0,tid:r.dataset.tid||''})).filter(t=>t.t)});S.sesiones.push({id:id(),...d,parts});Object.values(parts).flat().filter(t=>t.tid).forEach(t=>{const tt=(S.tareas||[]).find(x=>x.id===t.tid);if(tt)logUso(tt,'Usada en sesión',(d.fecha||'')+' · '+(d.cat||''))});save();R.sesiones()};
$('#lista').innerHTML=[...S.sesiones].sort((a,b)=>a.fecha<b.fecha?1:-1).map(cardSesion).join('')||emptyS('Sin sesiones todavía','Rellena el formulario y guarda tu primera sesión.')},

fisica(){$('#app').innerHTML=`<h2>Preparación física por jugador</h2><div class="grid">
<form class="card" id="f"><h3>Asignar trabajo</h3><label>Jugador</label><select name="jug"><option value="todos">Todo el equipo</option>${jOpts()}</select>
<div class="row"><div><label>Capacidad</label><select name="cap"><option>Resistencia aeróbica</option><option>Resistencia anaeróbica</option><option>Fuerza-resistencia</option><option>Fuerza-velocidad</option><option>Velocidad</option><option>Flexibilidad / movilidad</option><option>Preventivo / compensatorio</option><option>Readaptación lesión</option></select></div><div><label>Fase</label><select name="fase"><option>Pretemporada</option><option>Competición</option><option>Transición</option></select></div></div>
<label>Ejercicios</label><textarea name="ej" placeholder="Ej.: sentadilla autocarga, zancadas, plancha…"></textarea>
<div class="row"><div><label>Series</label><input name="series" type="number"></div><div><label>Reps / tiempo</label><input name="reps"></div><div><label>Recup.</label><input name="rec" placeholder="60 s"></div><div><label>RPE (1-10)</label><input name="rpe" type="number" min="1" max="10"></div></div>
<div class="row"><div><label>Días/semana</label><input name="dias" type="number"></div><div><label>Desde</label><input name="desde" type="date"></div></div>
<button class="btn">Guardar plan</button></form>
<div style="grid-column:span 2;min-width:0" class="grid">${S.planes.map(p=>`<div class="card"><span class="tag">${esc(p.cap)}</span> <span class="muted">${esc(p.fase)}</span><h3 style="margin-top:8px">${p.jug=='todos'?'Todo el equipo':esc(jName(p.jug))}</h3><div style="white-space:pre-wrap">${esc(p.ej)}</div><p class="muted">${esc(p.series)}×${esc(p.reps)} · rec. ${esc(p.rec)} · RPE ${esc(p.rpe)} · ${esc(p.dias)} días/sem${p.desde?' · desde '+esc(p.desde):''}</p>${btnEd('planes',p.id)}<button class="btn del" onclick="del('planes','${p.id}')">Borrar</button></div>`).join('')||emptyS('Sin planes físicos','Asigna trabajo a un jugador o a todo el equipo.')}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();S.planes.push({id:id(),...fd(e.target)});save();R.fisica()}},

pruebas(){const tests=PRUEBAS.map(p=>p.n);
$('#app').innerHTML=`<h2>Pruebas físicas y evolución</h2><div class="grid">
<form class="card" id="f"><h3>Registrar resultado</h3><label>Jugador</label><select name="jug" required>${jOpts()}</select>
<label>Prueba</label><select name="test">${tests.map(t=>`<option>${t}</option>`).join('')}</select>
<div class="row"><div><label>Resultado</label><input name="val" type="number" step="any" required></div><div><label>Fecha</label><input name="fecha" type="date" required value="${new Date().toISOString().slice(0,10)}"></div></div>
<button class="btn">Guardar</button>${S.jugadores.length?'':'<p class="muted">Primero añade jugadores.</p>'}</form>
<div class="card scroll" style="grid-column:span 2;min-width:0"><h3>Evolución (compara con su propio punto de partida)</h3>${tabEvol()}</div></div>`;
$('#f').onsubmit=e=>{e.preventDefault();S.pruebas.push({id:id(),...fd(e.target)});save();R.pruebas()}},

datos(){$('#app').innerHTML=`<h2>Copia de seguridad</h2><div class="card"><p>Los datos se guardan automáticamente cada vez que haces un cambio. Puedes exportar una copia de seguridad cuando quieras.</p>
<button class="btn" onclick="exp()">Exportar JSON</button> <label class="btn alt" style="display:inline-block">Importar JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label>
<button class="btn alt" onclick="window.print()">Imprimir vista</button></div><div class="card" style="margin-top:16px"><h3>Datos de ejemplo</h3><p class="muted">Carga 10 jugadores ficticios con pruebas físicas, partidos con minutos y sesiones para ver cómo quedan los gráficos y el calendario. Se pueden quitar cuando quieras sin tocar tus datos.</p><button class="btn alt" onclick="cargarDemo()">Cargar datos de ejemplo</button> <button class="btn del" onclick="quitarDemo()">Quitar datos de ejemplo</button><p id="msg" class="muted"></p></div>`}
};
function tabEvol(){const g={};S.pruebas.forEach(p=>{(g[p.jug+'|'+p.test]??=[]).push(p)});const rows=Object.values(g);if(!rows.length)return emptyS('Sin registros','Guarda un resultado para ver la evolución.');
return`<table><tr><th>Jugador</th><th>Prueba</th><th>Inicial</th><th>Último</th><th>Cambio</th><th>Nº</th></tr>${rows.map(r=>{r.sort((a,b)=>a.fecha<b.fecha?-1:1);const a=+r[0].val,b=+r[r.length-1].val,d=(b-a).toFixed(2);return`<tr><td>${esc(jName(r[0].jug))}</td><td>${esc(r[0].test)}</td><td>${a}</td><td>${b}</td><td><span class="delta ${Math.abs(d)<.005?'':d*pDir(r[0].test)>0?'up':'dn'}">${d>0?'+':''}${d}</span></td><td>${r.length}</td></tr>`}).join('')}</table>`}
function addTask(k,pre){pre=pre||{};const d=document.createElement('div');d.className='task';if(pre.tid)d.dataset.tid=pre.tid;d.innerHTML=`<input placeholder="Tarea (ej.: rondo 4x2, 2 toques)" value="${esc(pre.t||'')}"><input type="number" placeholder="min" value="${pre.m||''}"><button type="button" class="btn del" onclick="this.parentNode.remove()">×</button>`;$('#t_'+k).appendChild(d)}
let svgN=0;const tareaDe=t=>(S.tareas||[]).find(x=>x.id===t.tid)||(S.tareas||[]).find(x=>x.titulo&&t.t&&x.titulo.trim().toLowerCase()===t.t.trim().toLowerCase());
function cardSesion(s){const tot=Object.values(s.parts||{}).flat().reduce((a,t)=>a+t.m,0);const P={c:'Calentamiento',p:'Parte principal',v:'Vuelta a la calma'};
return`<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:center"><div><span class="tag">${esc(fmt(s.fecha))}${s.hora?" · "+esc(s.hora):""}</span> <b>${esc(s.cat)}</b> <span class="muted">${esc(s.micro)}</span></div><div style="text-align:right" class="muted">${tot||s.dur||0} min <button class=\"btn alt noprint\" onclick=\"programarSes('${s.id}')\">Añadir a un día</button> ${btnEd('sesiones',s.id)}<button class="btn del noprint" onclick="del('sesiones','${s.id}')">Borrar</button></div></div>
<h3 style="margin-top:8px">${esc(s.obj)||'Sin objetivo'}</h3>${s.mat?`<p class="muted">Material: ${esc(s.mat)}</p>`:''}

function abrirT(i){const t=S.tareas.find(x=>x.id===i);const nf=nuevaTarea().form;Object.keys(nf).forEach(k=>nf[k]=t[k]??'');ed={id:t.id,form:nf,fondo:t.fondo||'medio',els:JSON.parse(JSON.stringify(t.els||[])),sel:null};go('editor')}

const PRUEBAS=[{n:'Course Navette (palier)',d:1},{n:'Sprint 30 m (s)',d:-1},{n:'Salto CMJ (cm)',d:1},{n:'Sit and reach (cm)',d:1},{n:'Yo-Yo IR1 (m)',d:1},{n:'Agilidad 5-10-5 (s)',d:-1},{n:'FC reposo (ppm)',d:-1}];
const pDir=n=>(PRUEBAS.find(p=>p.n===n)||{d:1}).d;
const DIAS=['lun','mar','mié','jue','vie','sáb','dom'],MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const monday=s=>{const d=pd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d)};
const todayS=()=>ds(new Date());
let cal={view:'semana',ref:todayS()};
const evDia=f=>[...S.sesiones.filter(x=>x.fecha===f).map(x=>({k:'s',id:x.id,h:x.hora||'',t:(x.cat||'Sesión')+(x.obj?' · '+x.obj:''),as:asTxt(x)})),...(S.partidos||[]).filter(x=>x.fecha===f).map(x=>({k:'p',id:x.id,h:x.hora||'',t:(x.sede==='fuera'?'@ ':'vs ')+(x.rival||'Partido')}))].sort((a,b)=>(a.h||'99')<(b.h||'99')?-1:1);
const chipEv=e=>`<div class="ev ${e.k}" draggable="true" ondragstart="evDrag(event,'${e.k}','${e.id}')" onclick="event.stopPropagation();abrirEv('${e.k}','${e.id}')" title="${esc(e.t)}">${e.h?`<b>${esc(e.h)}</b> `:''}<span>${esc(e.t)}</span>${e.as?` <i class="asb" title="Asistencia">${e.as}</i>`:''}</div>`;
function evDrag(ev,k,i){ev.dataTransfer.setData('text/plain',k+':'+i);ev.dataTransfer.effectAllowed='move'}
function evDrop(ev,f){ev.preventDefault();ev.currentTarget.classList.remove('over');const [k,i]=ev.dataTransfer.getData('text/plain').split(':');const o=(k==='s'?S.sesiones:S.partidos).find(x=>x.id===i);if(o&&o.fecha!==f){o.fecha=f;save();R.calendario();toast('Movido al '+fmt(f))}}
const dOver=ev=>{ev.preventDefault();ev.currentTarget.classList.add('over')},dLeave=ev=>ev.currentTarget.classList.remove('over');
function calNav(n){if(n===0)cal.ref=todayS();else if(cal.view==='semana')cal.ref=addD(cal.ref,7*n);else{const d=pd(cal.ref);d.setDate(1);d.setMonth(d.getMonth()+n);cal.ref=ds(d)}R.calendario()}
R.calendario=function(){const hoy=todayS();let titulo,cells;
 if(cal.view==='semana'){const m=monday(cal.ref),e=addD(m,6),a=pd(m),b=pd(e);titulo=a.getDate()+(a.getMonth()!==b.getMonth()?' '+MESES[a.getMonth()].slice(0,3):'')+' – '+b.getDate()+' '+MESES[b.getMonth()].slice(0,3)+' '+b.getFullYear();cells=[...Array(7)].map((_,i)=>addD(m,i))}
 else{const d=pd(cal.ref);titulo=MESES[d.getMonth()]+' '+d.getFullYear();const first=new Date(d.getFullYear(),d.getMonth(),1);const m=monday(ds(first));const last=new Date(d.getFullYear(),d.getMonth()+1,0);const n=Math.ceil(((pd(monday(ds(last)))-pd(m))/864e5+7)/7)*7;cells=[...Array(n)].map((_,i)=>addD(m,i))}
 const mes=pd(cal.ref).getMonth();
 const cell=f=>{const d=pd(f),ev=evDia(f),sem=cal.view==='semana',lim=sem?99:3;return`<div class="cd ${f===hoy?'hoy':''} ${!sem&&d.getMonth()!==mes?'fuera':''}" ondragover="dOver(event)" ondragleave="dLeave(event)" ondrop="evDrop(event,'${f}')" onclick="modalDia('${f}')"><div class="dh"><span class="dn">${sem?DIAS[(d.getDay()+6)%7]+' ':''}<b>${d.getDate()}</b></span><button class="add noprint" aria-label="Añadir" onclick="event.stopPropagation();modalDia('${f}')">+</button></div>${ev.slice(0,lim).map(chipEv).join('')}${ev.length>lim?`<div class="more">+${ev.length-lim} más</div>`:''}</div>`};
 $('#app').innerHTML=`<h2>Calendario</h2><div class="calbar noprint"><div class="seg"><button class="${cal.view==='semana'?'on':''}" onclick="cal.view='semana';R.calendario()">Semana</button><button class="${cal.view==='mes'?'on':''}" onclick="cal.view='mes';R.calendario()">Mes</button></div><div class="navs"><button class="icon-btn" aria-label="Anterior" onclick="calNav(-1)">‹</button><button class="btn alt sm" style="margin:0" onclick="calNav(0)">Hoy</button><button class="icon-btn" aria-label="Siguiente" onclick="calNav(1)">›</button></div><b class="ctit">${titulo}</b><span class="sp"></span><span class="leg"><i class="s"></i>Sesión <i class="p"></i>Partido</span><button class="btn alt" style="margin:0" onclick="modalAsis()">Asistencia</button><button class="btn" style="margin:0" onclick="modalDia('${hoy}')">${ico('plus')}Añadir</button></div>
 ${cal.view==='mes'?`<div class="dow">${DIAS.map(x=>`<span>${x}</span>`).join('')}</div>`:''}<div class="cgrid ${cal.view}">${cells.map(cell).join('')}</div><p class="muted noprint" style="font-size:13px">Pulsa un día para añadir una sesión o un partido. Arrastra un evento a otro día para moverlo.</p>`};

function openModal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m);const i=m.querySelector('input,select');if(i&&innerWidth>700)i.focus()}

function formSesion(f){openModal(`<div class="mh"><h3>Nueva sesión · ${fmt(f)}</h3><button class="icon-btn" aria-label="Cerrar" onclick="closeModal()">×</button></div><form id="qs"><div class="row"><div><label>Fecha</label><input type="date" name="fecha" value="${f}" required></div><div><label>Hora</label><input type="time" name="hora" value="18:00"></div><div><label>Duración (min)</label><input type="number" name="dur" value="75"></div></div><label>Categoría</label><input name="cat" placeholder="Benjamín, Cadete…"><label>Objetivo principal</label><input name="obj" placeholder="Ej.: transiciones en 1-2-3-1"><div class="row"><button class="btn">Guardar sesión</button></div><p class="muted" style="font-size:13px">Después puedes añadir las tareas desde «Sesiones».</p></form>`);
 $('#qs').onsubmit=e=>{e.preventDefault();const d=fd(e.target);S.sesiones.push({id:id(),...d,micro:'',mat:'',parts:{c:[],p:[],v:[]}});save();closeModal();if(tab==='calendario')R.calendario();toast('Sesión añadida')}}
function formPartido(f,pid){const p=pid?S.partidos.find(x=>x.id===pid):{fecha:f,hora:'11:00',rival:'',sede:'casa',comp:'Liga'};openModal(`<div class="mh"><h3>${pid?'Editar':'Nuevo'} partido</h3><button class="icon-btn" aria-label="Cerrar" onclick="closeModal()">×</button></div><form id="qp"><div class="row"><div><label>Fecha</label><input type="date" name="fecha" value="${p.fecha}" required></div><div><label>Hora</label><input type="time" name="hora" value="${p.hora||''}"></div></div><label>Rival</label><input name="rival" value="${esc(p.rival)}" required placeholder="Nombre del rival"><div class="row"><div><label>Sede</label><select name="sede"><option value="casa" ${p.sede==='casa'?'selected':''}>En casa</option><option value="fuera" ${p.sede==='fuera'?'selected':''}>Fuera</option></select></div><div><label>Competición</label><input name="comp" value="${esc(p.comp)}"></div></div><button class="btn">Guardar</button><p class="muted" style="font-size:13px">Los minutos de cada jugador se anotan en «Partidos».</p></form>`);

function abrirEv(k,i){if(k==='p'){closeModal();pe=i;go('partidos');return}const s=S.sesiones.find(x=>x.id===i);if(!s)return;
 openModal(`<div class="mh"><h3>Sesión</h3><button class="icon-btn" aria-label="Cerrar" onclick="closeModal()">×</button></div>${cardSesion(s).replace('class="card" style="margin-bottom:12px"','style="margin-bottom:6px"')}<div id="asisbox" class="asisbox">${asisHtml(s)}</div><details class="pal2" style="margin-top:10px"><summary>Consejos para esta sesión</summary>${panelConsejos(consejosSesion(s))}</details><div class="row" style="margin-top:8px"><div><label>Cambiar fecha</label><input type="date" id="nf" value="${s.fecha}"></div><div><label>Hora</label><input type="time" id="nh" value="${s.hora||''}"></div></div><div class="row"><button class="btn" style="margin:12px 0 0" onclick="movS('${s.id}')">Guardar cambios</button><button class="btn alt" style="margin:12px 0 0" onclick="go('sesiones');closeModal()">Ir a sesiones</button><button class="btn del" style="margin:12px 0 0" onclick="closeModal();del('sesiones','${s.id}')">Borrar</button></div>`);if(document.activeElement)document.activeElement.blur();const mb=document.querySelector('#modal .mbox');if(mb)mb.scrollTop=0}
function movS(i){const s=S.sesiones.find(x=>x.id===i);s.fecha=$('#nf').value||s.fecha;s.hora=$('#nh').value;save();closeModal();R[tab]();toast('Sesión actualizada')}

{const d_=TABS.datos;delete TABS.datos;TABS.guia='Guía del entrenador';TABS.datos=d_}IC.guia='<path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V5.5M9 8h6M9 12h6"/>';

 tarea:{n:'Diseño de tareas',h:()=>`<div class="card"><h3>Variables del espacio</h3><table><tr><th>Si aumentas el espacio</th><th>Si lo disminuyes</th></tr><tr><td>Más fluidez de juego</td><td>Menos fluidez</td></tr><tr><td>Menos densidad de jugadores</td><td>Más densidad</td></tr><tr><td>Más seguridad en el juego</td><td>Menos seguridad</td></tr><tr><td>Más espacio para el poseedor</td><td>Menos espacio</td></tr><tr><td>Menos intensidad física</td><td>Más intensidad</td></tr><tr><td>Menos situaciones 1 contra 1</td><td>Más 1 contra 1</td></tr><tr><td>Más visión de juego</td><td>Menos visión</td></tr></table><p class="muted">Las reglas de provocación no deben atentar contra la lógica del juego.</p></div><div class="card"><h3>Reglas de provocación</h3><ul><li><b>Toque limitado:</b> aumenta el ritmo de juego y la velocidad, pero también las pérdidas.</li><li><b>Toque libre:</b> posesiones más largas, duelos y decisiones individuales.</li><li><b>Toque obligado:</b> provoca apoyos y decisiones grupales.</li></ul></div><div class="card"><h3>Objetivos del rondo</h3><ul><li><b>Ofensivos:</b> ${KB_RONDO.of}.</li><li><b>Defensivos:</b> ${KB_RONDO.de}.</li><li><b>Transiciones:</b> ${KB_RONDO.tr}.</li></ul></div><div class="card"><h3>Medios de entrenamiento</h3><p>Rondos, posesiones, juegos de posición, juegos, técnica colectiva, transiciones y partido modificado. Métodos: analítico, global y estructurado.</p><p class="muted">Figuras técnicas: inespecíficas (circuitos de inicio de pretemporada), semi-específicas (dibujo táctico en una zona) y específicas (una o dos posiciones).</p></div>`},
 fis:{n:'Capacidades físicas',h:()=>`<div class="card"><h3>Qué sí y qué no entre 6 y 12 años</h3><p><b>Se pueden desarrollar:</b> fuerza-resistencia aeróbica y explosiva; resistencia aeróbica y anaeróbica aláctica; reacción, aceleración y velocidad máxima; flexibilidad estática y dinámica.</p><p><b>No deben desarrollarse:</b> fuerza máxima, fuerza-resistencia anaeróbica láctica, resistencia anaeróbica láctica y velocidad-resistencia.</p></div><div class="card"><h3>Velocidad en niños</h3><ul><li>Distancias de 10 a 15 m a máxima intensidad.</li><li>60 a 90 m por sesión, 2 a 3 días por semana.</li><li>Recuperaciones completas (unos 2 minutos).</li><li>Estímulos y salidas diversas, planteamientos lúdicos.</li><li>Mayor mejora del tiempo de reacción entre 6 y 10 años; mayor aumento de la velocidad gestual entre 8 y 12.</li></ul></div><div class="card"><h3>Fuerza en niños</h3><ul><li>Juego como recurso, peso corporal, saltos, lanzamientos y ejercicios por parejas.</li><li>Balones medicinales de 1 a 3 kg.</li><li>1 a 3 series de unas 15 repeticiones, 2 a 3 veces por semana en días alternos.</li><li>Contraindicado: fuerza máxima y pliometría de alta intensidad (saltos desde altura).</li></ul></div><div class="card"><h3>Resistencia y flexibilidad</h3><ul><li>8 a 10 años: aeróbico extensivo, trotes de 3 a 5 min, juegos y terrenos variados.</li><li>11 a 12 años: continuos de 10 a 20 min intercalando fuerza.</li><li>Los niños sudan menos: cuida la hidratación.</li><li>Flexibilidad: fase sensible de 9 a 14 años; dinámica tras el calentamiento y estática al final.</li></ul></div><div class="card"><h3>Coordinación: fases sensibles</h3><ul><li>Coordinación bajo presión de tiempo: 6 a 8 años.</li><li>Reacción óptica y acústica: 8 a 10 años.</li><li>Ritmo: 7 a 9 (chicas) y 8 a 10 (chicos).</li><li>Equilibrio: 9 a 11 años.</li><li>Aprendizaje motor: 9 a 13 años.</li></ul></div>`},
 ses:{n:'La sesión',h:()=>`<div class="card"><h3>Tres partes</h3><p><b>Calentamiento:</b> toma de contacto, parte general (activación y movilidad) y parte específica (aproximación con balón, simulación de juego, finalización). Global, dinámico, progresivo y específico.</p><p><b>Parte principal:</b> contenidos técnicos, tácticos, físicos y psicológicos.</p><p><b>Vuelta a la calma:</b> enfriamiento, elasticidad y balance de la sesión.</p></div><div class="card"><h3>Principios básicos</h3><ul><li>Progresión: más volumen, intensidad, complejidad o tensión.</li><li>Continuidad: 7 días sin entrenar son un 10% de pérdida; 14 días, 35%.</li><li>Carga y recuperación (supercompensación).</li><li>Variedad: evita la monotonía.</li><li>Multilateralidad antes que especialización.</li><li>Individualización: planes por posición o por jugador.</li></ul></div><div class="card"><h3>Periodización</h3><p>Macrociclo (la temporada), mesociclo (3 a 6 semanas, lo más frecuente 4) y microciclo (la semana, formado por sesiones).</p></div><div class="card"><h3>Perfil y comunicación del entrenador</h3><ul><li>Explicación breve y concisa.</li><li>Vocabulario y comunicación constante con el resto de compañeros.</li><li>Puntualidad y organización para preparar la sesión.</li><li>Estilos: mando directo, asignación de tareas, enseñanza recíproca, descubrimiento guiado y resolución de problemas.</li></ul></div>`},
 mod:{n:'Modelo de juego',h:()=>`<div class="card"><h3>Cuatro momentos del juego</h3><ul><li><b>Organización ofensiva:</b> ¿cómo ataco? (combinativo o directo).</li><li><b>Transición defensiva:</b> ¿qué hago cuando pierdo el balón?</li><li><b>Organización defensiva:</b> ¿cómo defiendo? (zonal o mixto).</li><li><b>Transición ofensiva:</b> ¿qué hago cuando recupero?</li></ul><p class="muted">Para cada comportamiento responde: dónde, quiénes y cómo.</p></div><div class="card"><h3>Tipos de ventaja</h3><ul><li><b>Numérica:</b> más jugadores propios que rivales en una zona.</li><li><b>Posicional:</b> posiciones preestablecidas y ritmo que dificultan leer el juego.</li><li><b>Socio-afectiva:</b> complicidad entre compañeros.</li><li><b>Cualitativa:</b> calidad individual.</li></ul></div>`},
 fb:{n:'Ficha Benjamín',h:()=>`<div class="card"><h3>Sesión modelo: Conducir y regatear</h3><p>60 minutos, 12 jugadores + 2 porteros, campo de fútbol 7 o 40 x 30 m. Activación 10 min, tarea 1 12 min, tarea 2 13 min, juego aplicado 18 min y vuelta a la calma 7 min.</p><p class="muted"><b>Consignas clave:</b> balón pegado al pie, mira arriba, ve hacia el defensor y, cuando esté cerca, engáñale y acelera; si no puedes pasar, protege el balón o pasa.</p>${S.modeloBenj?'<p class="muted">Ya está cargada en tu histórico y en el calendario.</p>':'<button class="btn" onclick="modeloBenjamin();save();toast(\'Plantilla cargada\');R.guia()">Cargar tareas y sesión modelo</button>'}</div><div class="card"><h3>Notas para benjamín</h3><ul><li>Explicaciones de menos de 1 minuto y demostración.</li><li>Un balón por jugador, sin filas largas.</li><li>Los porteros juegan como jugadores de campo en activación y tareas.</li><li>Premiar que lo intenten: un regate fallado por atreverse es positivo.</li></ul></div>`}};

function volver(){if(document.getElementById('modal')){closeModal();return}const t=navHist.pop()||'inicio';navSkip=true;try{_go0(t)}finally{navSkip=false}}
window.addEventListener('popstate',()=>{if(document.getElementById('modal')){closeModal();return}if(navHist.length)volver()});
function barraAtras(){const a=document.getElementById('app');if(!a)return;let b=document.getElementById('barAtras');
 if(tab==='inicio'){if(b)b.remove();return}
 if(!b){b=document.createElement('div');b.id='barAtras';b.className='noprint';b.style.cssText='margin:0 0 10px';b.innerHTML='<button type="button" class="btn alt sm" style="margin:0" onclick="volver()">← Atrás</button>';a.insertBefore(b,a.firstChild)}
 // Cancelar en formularios de la página
 a.querySelectorAll('form').forEach(f=>{if(f.querySelector('.btn-cancelar')||!f.querySelector('button:not([type=button]),button.btn:not([type=button])'))return;const sb=[...f.querySelectorAll('button')].find(x=>!x.type||x.type==='submit');if(!sb)return;const c=document.createElement('button');c.type='button';c.className='btn alt btn-cancelar';c.textContent='Cancelar';c.onclick=()=>{f.reset();toast('Cancelado');if(navHist.length&&(tab==='editor'||tab==='sesiones'))volver()};sb.after(' ',c)});
 if(tab==='editor'){const sv=[...a.querySelectorAll('button')].find(x=>/Guardar (en el hist|cambios)/.test(x.textContent));if(sv&&!a.querySelector('.btn-cancelar-ed')){const c=document.createElement('button');c.type='button';c.className='btn alt btn-cancelar-ed';c.textContent='Cancelar';c.onclick=()=>{ed=null;volver()};sv.after(' ',c)}}}
new MutationObserver(()=>{const a=document.getElementById('app');if(!a)return;const b=document.getElementById('barAtras');if(tab!=='inicio'&&(!b||a.firstChild!==b)||tab==='inicio'&&b||a.querySelector('form:not(:has(.btn-cancelar))'))barraAtras()}).observe(document.getElementById('app'),{childList:true});
// Modales: botón Cancelar junto a Guardar
const _om0=openModal;
openModal=function(h){_om0(h);const m=document.getElementById('modal');if(!m)return;m.querySelectorAll('form').forEach(f=>{if(f.querySelector('.btn-cancelar'))return;const sb=[...f.querySelectorAll('button')].find(x=>!x.type||x.type==='submit');if(!sb)return;const c=document.createElement('button');c.type='button';c.className='btn alt btn-cancelar';c.textContent='Cancelar';c.onclick=closeModal;sb.after(' ',c)})};
barraAtras();
lkPantalla();
</script>
</body></html>
